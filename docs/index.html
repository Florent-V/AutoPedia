nistration du catalogue, protégées par jeton.\n- **Côté front** : client `better-auth/vue`, et un middleware global qui redirige vers `/login` les pages protégées.\n\n## Protection contre les abus\n\n| Risque | Protection |\n| --- | --- |\n| Force brute sur la connexion | Limitation Better Auth : 10 tentatives par minute et par IP sur `/sign-in/email`, 5 inscriptions par minute sur `/sign-up/email`, 100 requêtes par minute sur le reste de `/api/auth` |\n| IP falsifiée pour contourner la limitation | Le proxy Nuxt **écrase** `X-Forwarded-For` avec l'IP réelle de la connexion. Il ne fait confiance à l'en-tête entrant que si `TRUST_PROXY=true` (reverse proxy de confiance devant le site) |\n| CSRF | Cookies `SameSite=Lax`, origines de confiance (`trustedOrigins` = `WEB_ORIGIN`), API sur la même origine. En plus, **toute action** (`POST`…) portant un en-tête `Origin` étranger ou `Sec-Fetch-Site: cross-site` est refusée (403, `shared/http/origin-check.ts`) |\n| Affichage du site dans un cadre (clickjacking) | Le site Nuxt envoie `X-Frame-Options: DENY` et `Content-Security-Policy: frame-ancestors 'none'`, plus `nosniff`, `Referrer-Policy` et `Permissions-Policy` |\n| Dépendances vulnérables | `npm audit` corrigé dans les deux applications (dont `sharp` 0.35.5, qui traite les images téléchargées, et `multer` forcé en 2.5). Reste un avertissement sur `deepmerge-ts`, utilisé uniquement par l'outil en ligne de commande de Prisma (lecture de sa configuration), jamais sur une donnée joueur |\n| Base de données exposée | Port PostgreSQL publié uniquement sur `127.0.0.1` |\n| Accès aux fichiers via `/api/media` | `express.static` avec `dotfiles: deny` ; les tentatives `../` renvoient 403 (vérifié) |\n| Routes d'administration | En-tête `x-admin-token` comparé en temps constant ; désactivées si `ADMIN_TOKEN` fait moins de 16 caractères |\n| Secrets | `BETTER_AUTH_SECRET` obligatoire en production ; graine de la boutique dérivée de ce secret ou définie par `SHOP_SECRET` |\n| Entrées malformées ou enrichies | `ValidationPipe` global (`whitelist`, `forbidNonWhitelisted`, `forbidUnknownValues`) : **tout champ non prévu est refusé (400)**, on ne peut donc rien glisser de plus (prix, carte, gagnant…) dans une requête. Identifiants vérifiés (`ParseUUIDPipe`, `ParseIntPipe`, `ParseEnumPipe`), pagination bornée (page ≤ 10 000, 100 éléments au plus). Les objets-valeurs du domaine revalident les montants (`Credits` : entier, jamais négatif, plafonné) |\n| Rafales de requêtes | `@nestjs/throttler` par joueur connecté (par IP sinon) : 20 requêtes par seconde et 300 par minute au plus (429 au-delà) |\n| En-têtes HTTP | `helmet` : `Content-Security-Policy: default-src 'none'`, `X-Content-Type-Options: nosniff`, `Cross-Origin-Resource-Policy: same-site`, pas de `X-Powered-By` |\n| Notifications vers une adresse interne (SSRF) | L'adresse d'abonnement push doit être en HTTPS, sans port ni identifiant, et viser un service de notification connu (Google, Mozilla, Apple, Microsoft ; `PUSH_ALLOWED_HOSTS` pour en changer) |\n| Taille des requêtes | Corps JSON limité à 100 ko |\n\n## Anti-triche\n\nLe principe : **le client n'est jamais cru**. Toute règle de jeu est appliquée par le serveur.\n\n| Fonction | Ce que le client ne peut pas faire |\n| --- | --- |\n| Boosters | Choisir ses cartes : le tirage se fait côté serveur, sous verrou. Ouvrir plus de boosters que la réserve : celle-ci est calculée à partir de l'heure du **serveur** |\n| Mini-jeux | Connaître la réponse : elle reste dans `game_session.state` et la vue envoyée au client la retire (vérifié par test). Répondre deux fois à une manche : verrou sur la partie. Relancer une partie pour tomber sur une question plus facile : la partie active est reprise et toute partie commencée compte dans la limite du jour. Deviner à partir du nom de fichier de la photo : les fichiers sont nommés d'après le QID Wikidata |\n| Boutique | Acheter une offre absente de la rotation en cours : l'offre est recalculée côté serveur. L'acheter deux fois : contrainte d'unicité. Payer moins cher : le prix est recalculé côté serveur |\n| Bourse | Vendre une carte deux fois : séquestre. Accepter une offre deux fois : verrou et statut. Créer des crédits : la bourse ne fait que transférer, chaque mouvement est journalisé. Transférer ses biens depuis des comptes jetables : marché réservé aux comptes de plus de 24 h ayant ouvert 3 boosters, prix plancher par rareté, échanges limités à des raretés proches |\n| Enchères | Enchérir sous le minimum, sur sa propre vente ou après la fin ; dépenser plus que son solde (les crédits sont bloqués dès l'offre) ; gonfler une vente avec un compte jetable (mêmes conditions d'accès que la bourse) |\n| Récompense quotidienne | La réclamer deux fois ou fausser la série : dates calculées par l'horloge du serveur, sous verrou |\n| Crédits | Les modifier : seules les règles du serveur écrivent `player.credits`, et chaque mouvement est enregistré dans `credit_transaction` |\n\nLe détail complet, contrôle par contrôle, est dans [Architecture DDD : où sont faits les contrôles anti-triche](13-architecture.md#où-sont-faits-les-contrôles-anti-triche).\n\n## Limites connues\n\n- **Comptes multiples** : les garde-fous du marché rendent l'abus lent et coûteux, sans l'empêcher totalement. Un joueur patient peut encore préparer des comptes pendant plusieurs jours. Les étapes suivantes seraient la vérification de l'email (il faut un serveur d'envoi), une limite de comptes par adresse IP, ou la détection de transferts répétés entre les deux mêmes comptes.\n- **Limitation de débit en mémoire** : avec plusieurs instances de l'API, il faudrait un stockage partagé (Redis).\n- Un joueur peut chercher les réponses du quiz sur Internet. Aucun chronomètre n'est imposé pour l'instant (voir [Évolutions](11-evolutions.md)).\n\n## Données personnelles\n\nLe jeu ne stocke que le pseudo, l'email, le mot de passe haché, les sessions (avec l'IP et le navigateur, conservés par Better Auth) et les données de jeu. Seul le **pseudo** est visible des autres joueurs, sur les offres de la bourse. La suppression d'un compte supprime en cascade toutes ses données, y compris ses offres de bourse (et les cartes qu'elles tenaient en séquestre).\n"},{"id":"technique/04-moteur-de-jeu","path":"technique/04-moteur-de-jeu.md","section":"Technique","title":"4. Moteur de jeu","markdown":"# 4. Moteur de jeu\n\nLa logique de jeu est faite d'**agrégats** et de **fonctions pures** (couches `domain/` des contextes `collection` et `catalog`), couvertes par des tests unitaires. Les services ne font qu'orchestrer : verrous, lecture, appel des règles, écriture.\n\n## Horloge des boosters (`collection/domain/booster-clock.ts`, agrégat `BoosterReserve`)\n\nAucune tâche planifiée ne distribue les boosters. L'état stocké se résume à **deux valeurs** :\n\n- `boosters` : le nombre de boosters à l'instant de l'ancre ;\n- `boosterAnchor` : le point de départ du minuteur.\n\nÀ chaque lecture, `computeBoosters(state, now, max, regenMs)` calcule l'état courant :\n\n```\nsi boosters ≥ max      → réserve pleine, minuteur figé (ancre = maintenant)\nsinon\n  gagnés = ⌊(maintenant − ancre) / intervalle⌋\n  si boosters + gagnés ≥ max → plein, ancre = maintenant\n  sinon boosters += gagnés ; ancre += gagnés × intervalle   (conserve la fraction entamée)\nprochainBooster = ancre + intervalle\n```\n\n`consumeBooster(status, now)` retire un booster. Si la réserve était pleine, le minuteur démarre à cet instant. Sinon, l'ancre reste inchangée et le temps déjà écoulé n'est pas perdu.\n\nAvantages : aucun cron, aucune dérive, et un résultat exact même après des semaines d'absence. Le front reçoit `nextAt` et l'heure du serveur, et calcule l'écart d'horloge pour afficher un compte à rebours juste.\n\n## Tirage (`catalog/domain/rarity.ts`, `collection/domain/booster-draw.ts`)\n\n1. `rollBoosterRarities(5, random, pity)` tire une rareté par emplacement :\n   - emplacements 1 à 4 : poids `dropWeight` (62 / 26 / 9 / 2,5 / 0,5) ;\n   - emplacement 5 (vedette) : poids `featuredWeight` (0 / 55 / 33 / 9,5 / 2,5).\n2. **Garantie** : `pityFor(sinceEpic, sinceLegendary, 10, 60)` indique si ce booster doit contenir une Épique ou une Légendaire. Si le tirage ne la contient pas déjà, la carte vedette est remplacée : par une Légendaire si la garantie Légendaire est active, sinon par une Épique (80 %) ou une Légendaire (20 %).\n3. Pour chaque rareté tirée, `CatalogReader.randomCar` choisit une voiture au hasard (`ORDER BY random()`) parmi les cartes actives de cette rareté, en excluant celles déjà tirées dans le booster. S'il n'y en a pas, il se rabat sur la rareté la plus proche. Les doublons ne sont autorisés qu'en dernier recours, pour les tout petits catalogues.\n4. Les compteurs `sinceEpic` et `sinceLegendary` sont remis à zéro ou incrémentés selon le résultat.\n\nL'aléatoire du tirage utilise `Math.random()` côté serveur. Un aléatoire cryptographique n'apporterait rien ici : le client ne voit jamais l'état du générateur.\n\n## Attribution des raretés (`assignRarities`)\n\nAprès chaque import, `CatalogService.recomputeRarities()` trie les cartes actives par `popularity` décroissante, puis découpe la liste : 2 % Légendaire, 6 % Épique, 15 % Rare, 27 % Peu commune, 50 % Commune. Chaque tranche prend au moins une carte tant qu'il en reste : même un catalogue minuscule a au moins une Légendaire. En revanche, avec seulement trois cartes, seules les trois raretés les plus élevées sont représentées. Une carte avec `rarityOverride` garde sa rareté forcée, car `COALESCE(rarityOverride, rarity)` est appliqué partout.\n\n## Ouverture d'un booster (`BoostersService.open`)\n\nTout se passe dans **une seule transaction** :\n\n1. `SELECT … FOR UPDATE` sur la ligne `player` : les ouvertures simultanées sont traitées l'une après l'autre (testé : 12 requêtes parallèles avec 9 boosters donnent 9 succès et 3 refus « aucun booster »).\n2. Calcul de la réserve, puis refus (409) si elle est vide.\n3. Tirage avec garantie.\n4. Mise à jour de `player` : réserve, ancre, compteurs, garanties.\n5. Ajout des cartes (`CardsService.grant`) et historique (`booster_opening`). Les raretés sont tirées avec un aléatoire cryptographique (`crypto.randomInt`).\n6. Calcul des statistiques et évaluation des succès.\n7. Réponse : cartes (avec `isNew` et `quantity`), nouvel état de la réserve, statistiques, nouveaux succès, garantie appliquée.\n\n## Statistiques et succès\n\n`computePlayerStats` calcule en **deux requêtes SQL** toutes les statistiques du joueur : cartes uniques, points, nombre par rareté, voitures de course, pays et décennies distincts, maximum par marque et maximum d'exemplaires. S'y ajoutent les compteurs de `player`. `AchievementsService.evaluate` compare ces statistiques aux définitions et insère les nouveaux succès (`createMany … skipDuplicates`).\n"},{"id":"technique/05-economie-implementation","path":"technique/05-economie-implementation.md","section":"Technique","title":"5. Économie : implémentation","markdown":"# 5. Économie : implémentation\n\n## Briques communes\n\nToutes les fonctionnalités économiques passent par ces services, appelés **dans une unité de travail** (transaction portée par le contexte, voir [Architecture DDD](13-architecture.md)) :\n\n| Service | Rôle |\n| --- | --- |\n| `PlayerLocks.lock(...ids)` (noyau partagé) | `SELECT … FOR UPDATE` sur les lignes `player`, **triées par identifiant** pour éviter les interblocages entre deux joueurs |\n| `WalletService.credit / debit` (contexte `wallet`) | Seul point d'écriture du solde, via l'agrégat `Wallet` : montants entiers positifs (objet-valeur `Credits`), solde jamais négatif (409), ligne de journal avec le solde résultant, `creditsEarned` pour les gains, contrôle de concurrence optimiste à l'écriture |\n| `CardsService.grant` (contexte `collection`) | `upsert` sur `user_card` ; renvoie `{ quantity, isNew }` |\n| `CardsService.take` | Décrément conditionnel, ou suppression au dernier exemplaire ; 400 si la carte n'est pas possédée |\n| `CardsService.draw(rareté, exclues)` | Carte active au hasard de la rareté voulue (ou de la plus proche) |\n\n## Mini-jeux (contexte `games`)\n\n### Cycle de vie d'une partie\n\n```\nPOST /games/:type/start\n  ├─ partie ACTIVE de moins d'une heure ? → la renvoyer (reprise)\n  ├─ partie ACTIVE plus ancienne → FINISHED (abandon)\n  ├─ parties du jour (fuseau GAME_TIMEZONE) ≥ GAMES_PER_DAY → 409\n  └─ création : state = { used: [ids], current: question + réponse, history: [] }\n\nPOST /games/sessions/:id/answer { choice }\n  ├─ verrou joueur, puis FOR UPDATE sur game_session (partie du joueur, sinon 404)\n  ├─ agrégat GameSession : statut ACTIVE (409), forme de la réponse ('a' | 'b', 0..3, 0..2 : 400),\n  │  jugement avec la manche gardée sur le serveur\n  ├─ correct ? → WalletService.credit(+gain) ou CardsService.grant(carte en jeu)\n  ├─ fin ? (dernière manche, ou erreur au duel)\n  │    ├─ sans-faute → carte bonus (rareté de carte vedette) via CardsService\n  │    └─ gamesPlayed++\n  ├─ sinon : QuestionFactory génère la manche suivante (cartes déjà utilisées exclues)\n  └─ événement GameRoundPlayed → succès évalués dans la même transaction\n```\n\n### Deux modes de récompense\n\n`defineGames` (`games/domain/game-rules.ts`) décrit chaque jeu : nombre de manches, parties par jour, `reward` (`credits` ou `card`), arrêt à la première erreur, carte bonus pour un sans-faute, format de réponse attendu (`'a'`/`'b'`, 3 ou 4 choix).\n\n| Type | Manches | Récompense | Réponse |\n| --- | --- | --- | --- |\n| `DUEL` | 10 (arrêt à la 1ʳᵉ erreur) | 10 🪙 par bonne réponse + bonus | `'a'`/`'b'` |\n| `QUIZ` | 5 | 15 🪙 par bonne réponse + bonus | 0..3 |\n| `WEIGHT` | 1 | la carte `prizeCarId` (la plus lourde) | `'a'`/`'b'` |\n| `MYSTERY` | 1 | la carte `prizeCarId` (la carte montrée) | 0..3 |\n| `DOORS` | 1 | la carte derrière la porte choisie | 0..2 |\n\nPour les jeux à carte, la question stockée contient `prizeCarId`. Pour les 3 garages, elle contient `outcomes` (`tier` et `carId` des trois portes). Ces champs sont retirés de la vue envoyée au client (`publicQuestion`, testé), au même titre que `answer`. La réponse à `answer` contient alors `prize` (la carte gagnée, avec `isNew` et `quantity`) et, pour les 3 garages, `doors` (le contenu révélé des trois portes). Les compteurs `gameCardsWon` et `doorsJackpots` du joueur alimentent les succès.\n\n### Génération des questions (`games/infrastructure/sql-question-factory.ts`)\n\nTout l'aléatoire en mémoire (mélange des réponses, choix du critère, ordre des portes) passe par la source d'aléatoire **cryptographique** injectée. On ne peut donc pas déduire la position de la bonne réponse de tirages précédents.\n\n\n- **Duel** : on choisit au hasard un critère (vitesse, puissance, masse, longueur, année, notoriété), puis on cherche parmi 40 voitures aléatoires qui ont ce critère une paire dont l'écart passe le seuil `minGap`. Si aucune paire ne convient, on essaie le critère suivant. Les noms de colonnes viennent d'une liste fixe : pas d'injection SQL possible.\n- **Quiz** : on choisit un type au hasard (marque, pays, décennie, photo), puis une voiture qui a la donnée nécessaire, puis trois mauvaises réponses (`DISTINCT … ORDER BY random()`). Pour la photo, les mauvaises réponses sont d'abord prises dans la même marque. L'ordre des choix est mélangé, sauf pour les décennies.\n- **Poids lourds** (`makeWeightRound`) : rareté de chaque voiture tirée avec `rollRarity(false)`, puis une voiture de cette rareté avec une masse connue ; 6 essais pour trouver une paire avec au moins 8 % d'écart (les 2 derniers sans contrainte de rareté), puis repli sur `makeDuelRound`.\n- **Question pour une carte** (`makeMysteryRound`) : rareté tirée avec `rollRarity(false)`. Le type de question dépend de la rareté (pays, décennie, année exacte) et se rabat sur un type plus simple si la donnée manque. Les décennies proposées sont 4 décennies consécutives, la bonne étant à une position aléatoire ; les années sont 4 années distinctes à ±6 ans au plus, triées.\n- **Les 3 garages** (`makeDoorsRound`) : une carte Commune ou Peu commune (70/30) et d'une Épique ou Légendaire (80/20), plus une porte vide, dans un ordre mélangé.\n- **Vue client** : `publicQuestion()` retire `answer`, `reveal`, `carId`, `prizeCarId` et `outcomes` de la question avant de l'envoyer. Les cartes de jeu (`gameCard`) ne contiennent que l'identifiant, le nom, la marque, l'image et la rareté : aucune valeur qui donnerait la réponse.\n\n## Boutique (contexte `marketplace`)\n\n### Rotation (`marketplace/domain/shop-rotation.ts`, fonctions pures et testées)\n\nPour une date `D` (dans le fuseau du jeu), une heure `h` et une rareté `r` :\n\n```\nprogramme(r, D) = mélange déterministe (Fisher-Yates + mulberry32)\n                  des identifiants de cartes actives de rareté r,\n                  avec la graine sha256(SECRET : D : r)\n\nrotation      = ⌊h / toutesLesNHeures(r)⌋\noffre n° i    = programme[(rotation × parRotation(r) + i) mod taille]\nclé d'offre   = « D T HH : r : i »   (HH = début de la rotation)\naffaire       = une offre de l'heure tirée avec la graine (SECRET : D : h : deal), −25 %\n```\n\nPropriétés vérifiées par les tests :\n\n- **stable** pendant l'heure, et **différente** à l'heure suivante ;\n- **aucune répétition** dans la journée tant que la rareté a assez de cartes ;\n- les Légendaires gardent la même clé pendant 4 heures (donc un seul achat possible sur toute la période) ;\n- exactement **une affaire** par heure.\n\nAucune table ne stocke le programme : il est **recalculé** à chaque requête à partir de la liste des cartes et de la graine. Si le catalogue change en cours de journée (import), le programme du jour change aussi. C'est acceptable, et la contrainte d'unicité des achats reste cohérente.\n\n### Achat (`ShopService.buy`)\n\nTransaction : verrou joueur, recalcul des offres de l'heure courante, offre introuvable → 404 (« la boutique a tourné »), création de `shop_purchase` (l'unicité `(userId, offerKey)` empêche le double achat), puis `WalletService.debit(prix)`, `CardsService.grant`, `shopPurchases++` et événement `ShopCardPurchased` (succès). Le client n'envoie que la clé de l'offre : carte et prix viennent du serveur. Si les crédits manquent, tout est annulé. Testé : 5 achats simultanés de la même offre donnent 1 succès, 4 refus et un seul débit.\n\n## Bourse d'échanges (contexte `marketplace`, agrégat `TradeOffer`)\n\n### Garde-fous contre les comptes multiples (`marketplace/domain/market-policy.ts`)\n\n| Règle | Réglage | Par défaut |\n| --- | --- | --- |\n| Ancienneté minimale du compte (vendre, accepter, mettre aux enchères, enchérir) | `MARKET_MIN_ACCOUNT_HOURS` | 24 h |\n| Boosters ouverts au minimum | `MARKET_MIN_BOOSTERS` | 3 |\n| Écart de rareté maximal d'un échange carte contre carte | `TRADE_MAX_RARITY_GAP` | 1 |\n| Prix plancher (vente à la bourse, mise à prix) | `priceFloor` | 5 / 15 / 50 / 150 / 500 |\n\nLes bots (`player.isBot`) sont dispensés des deux premières règles. Les listes `/trades` et `/auctions` renvoient `market { canTrade, reason, priceFloor, maxSwapRarityGap }` pour que l'interface explique un refus avant même l'action.\n\n### Création\n\nTransaction : verrou vendeur, accès au marché, plafond d'offres ouvertes, existence de la carte demandée et écart de rareté (échange) ou prix plancher (vente), puis **`CardsService.take` (séquestre)** et création de l'offre (`expiresAt = maintenant + TRADE_DAYS`). Exactement l'une des deux contreparties doit être renseignée : `wantedCarId` ou `price`.\n\n### Acceptation\n\n```\ntransaction :\n  FOR UPDATE trade_offer → TradeOffer.accept : statut OPEN ; acheteur ≠ vendeur ; pas expirée\n  PlayerLocks.lock(acheteur, vendeur)     (offre puis joueurs triés → pas d'interblocage)\n  si carte demandée : take(acheteur, demandée) ; grant(vendeur, demandée)\n  sinon             : debit(acheteur, prix, trade:purchase)\n                      credit(vendeur, prix, trade:sale)\n  grant(acheteur, carte proposée)\n  statut COMPLETED, buyerId ; tradesCompleted++ pour les deux\n  événement TradeCompleted → succès des deux joueurs (même transaction)\naprès validation : notification push au vendeur (abonné @AfterCommit)\n```\n\nTesté : deux acceptations simultanées donnent 200 et 409.\n\n```mermaid\nsequenceDiagram\n  actor A as Acheteur\n  participant T as TradesService\n  participant O as TradeOffer\n  participant L as PlayerLocks\n  participant W as WalletService\n  participant C as CardsService\n  A->>T: POST /trades/:id/accept\n  T->>O: getForUpdate(id) (verrou de l'offre)\n  T->>O: accept(acheteur, maintenant)\n  O-->>T: ouverte ? pas la sienne ? pas expirée ?\n  T->>L: lock(acheteur, vendeur) (triés)\n  T->>T: accès au marché de l'acheteur\n  alt vente contre crédits\n    T->>W: debit(acheteur, prix)\n    T->>W: credit(vendeur, prix)\n  else échange\n    T->>C: take(acheteur, carte demandée)\n    T->>C: grant(vendeur, carte demandée)\n  end\n  T->>C: grant(acheteur, carte proposée)\n  T->>T: TradeCompleted → succès, COMMIT, push au vendeur\n  T-->>A: carte, solde, newAchievements\n```\n\n### Annulation et expiration\n\nLe retrait (`TradeOffer.cancel`, vendeur seulement) et l'expiration (`TradeOffer.expire`) rendent la carte au vendeur (`CardsService.grant`) et passent l'offre en CANCELLED. L'expiration est traitée par `TradesService.expireDue()` (tâche `MarketJobs`), 3 secondes après le démarrage puis toutes les `TRADE_EXPIRE_SECONDS` (10 minutes par défaut). Chaque offre est traitée dans sa propre transaction avec verrou. Les listes filtrent de toute façon `expiresAt > maintenant`, et une acceptation après expiration est refusée même si le nettoyage n'est pas encore passé.\n\n### Onglet « Pour moi »\n\nRequête : offres des autres joueurs dont la carte proposée **n'est pas** dans ma collection, **et** dont la carte demandée est dans ma collection **ou** dont le prix est inférieur ou égal à mon solde.\n\n## Enchères (contexte `marketplace`, agrégat `Auction`)\n\n### Création\n\nTransaction : verrou vendeur, plafond `MAX_OPEN_AUCTIONS`, durée parmi `[1, 3, 6, 12, 24]` h, **séquestre** (`CardsService.take`), création avec `endsAt = maintenant + durée`.\n\n### Offre (`bid`)\n\n```\ntransaction :\n  FOR UPDATE auction → Auction.bid : OPEN ; endsAt > maintenant ; montant entier borné\n  refus : vendeur, meilleur enchérisseur actuel, montant \u003c minBid\n  minBid = currentBid ? currentBid + max(1, ⌈5 % × currentBid⌉) : startPrice\n  si endsAt − maintenant \u003c 120 s → endsAt = maintenant + 120 s  ← anti « dernière seconde »\n  PlayerLocks.lock(enchérisseur, ancien meilleur enchérisseur)\n  debit(enchérisseur, montant, 'auction:bid')                  ← crédits bloqués\n  credit(ancien, son montant, 'auction:refund')                ← remboursement immédiat\n  bid + mise à jour de l'enchère ; événement AuctionOutbid\naprès validation : notification push « surenchéri » à l'ancien meilleur enchérisseur\n```\n\n```mermaid\nsequenceDiagram\n  actor B as Enchérisseur\n  participant S as AuctionsService\n  participant AU as Auction\n  participant W as WalletService\n  B->>S: POST /auctions/:id/bid { amount }\n  S->>AU: getForUpdate(id) (verrou de l'enchère)\n  S->>AU: bid(joueur, montant, maintenant)\n  AU-->>S: en cours ? pas le vendeur ? pas déjà en tête ? ≥ minimum ?\u003cbr/>(prolongation si \u003c 2 min) → précédent meilleur enchérisseur\n  S->>S: lock(enchérisseur, précédent) + accès au marché\n  S->>W: debit(enchérisseur, montant) — crédits bloqués\n  S->>W: credit(précédent, son montant) — remboursement\n  S->>S: bid enregistrée, AuctionOutbid, COMMIT, push au précédent\n  S-->>B: meilleure offre, minimum suivant, fin, solde\n```\n\n### Règlement (`settleDue`, toutes les 30 s et 3 s après le démarrage)\n\nPour chaque enchère OPEN échue, dans sa propre transaction et sous verrou : `Auction.settle` décide : sans offre → carte rendue au vendeur et UNSOLD ; avec offre → carte à l'acheteur, `credit(vendeur, montant − commission, 'auction:sale')`, compteurs `auctionsWon` / `auctionsSold`, SOLD. L'événement `AuctionSettled` déclenche les succès des deux joueurs (même transaction), puis les notifications (après validation). La commission (`AUCTION_FEE_PERCENT`, 5 %) n'est versée à personne : elle sort de l'économie.\n\nTests réalisés : offre trop basse (400), surenchère sur soi-même (409), remboursement exact du surenchéri, prolongation à 120 s, annulation refusée après une offre (409), règlement (carte au gagnant, 25 − 5 % = 24 crédits au vendeur), annulation sans offre.\n\n## Récompense quotidienne (contexte `progression`, agrégat `DailyStreak`)\n\n`claim` : verrou joueur ; `today` et `yesterday` calculés dans `GAME_TIMEZONE` ; refus si `lastDailyClaim = today` ; `streak = lastDailyClaim = yesterday ? dailyStreak + 1 : 1` ; récompense `DAILY_REWARDS[(streak − 1) mod 7]`. Les boosters sont ajoutés (`BoosterReserve.grant`) après application de la régénération en cours, et peuvent dépasser le maximum (`computeBoosters` renvoie alors « plein » sans plafonner). La carte du jour 7 est tirée par `CardsService.draw` (Épique, ou Légendaire à 20 %). Mise à jour de la série et de la meilleure série, puis évaluation des succès.\n\n## Récompenses des succès\n\n`AchievementsService.evaluate` insère chaque succès atteint avec `INSERT … ON CONFLICT DO NOTHING RETURNING`, et ne verse `TIER_REWARD[palier]` (`WalletService.credit`, motif `achievement`) que si la ligne a effectivement été insérée. L'évaluation est déclenchée par les événements de domaine des autres contextes (`BoosterOpened`, `GameRoundPlayed`, `ShopCardPurchased`, `TradeCompleted`, `AuctionSettled`), dans la même transaction. Les succès débloqués pendant une requête sont ajoutés à sa réponse (`newAchievements`) par un intercepteur. Deux évaluations concurrentes (par exemple les deux joueurs d'un échange, ou une page Succès ouverte pendant une ouverture de booster) ne peuvent donc pas payer deux fois.\n"},{"id":"technique/06-catalogue-import","path":"technique/06-catalogue-import.md","section":"Technique","title":"6. Catalogue : import des données","markdown":"# 6. Catalogue : import des données\n\nTout le contenu du jeu vient de sources libres de la fondation Wikimedia, et **tout est rapatrié localement** : données et résumés en base, photos dans `MEDIA_DIR`.\n\n| Source | Licence | Ce qu'on en tire |\n| --- | --- | --- |\n| Wikidata (service SPARQL) | CC0 | Liste des voitures, caractéristiques, notoriété, photo de référence, titres d'articles |\n| Wikimedia Commons (API) | Variable selon la photo (souvent CC BY-SA) | Miniatures, auteur et licence de chaque photo |\n| Wikipédia (API) | CC BY-SA | Résumé d'introduction ; image principale pour le jeu de secours |\n\n## Déroulé\n\n```\nimport(source, limite)\n ├─ 1. Données\n │    ├─ wikidata : liste des voitures → détails par lots → upsert → raretés\n │    └─ en cas d'échec et de catalogue vide : jeu de secours (115 voitures)\n └─ 2. Médias (MediaService.syncAll)\n      ├─ photos Commons des voitures Wikidata\n      ├─ fichiers images des cartes de secours (via Wikipédia), puis leurs photos\n      └─ résumés Wikipédia manquants\n```\n\nDéclenchement :\n\n- **automatique** au premier démarrage, si le catalogue est vide (`CATALOG_AUTO_IMPORT=wikidata|seed|off`) ;\n- **reprise des médias** à chaque démarrage et toutes les 6 heures (`MEDIA_SYNC_HOURS`) ;\n- **à la main** : `node dist/cli/import-catalog [wikidata|seed|media|stats] [limite]` ;\n- **à distance** : `POST /api/admin/catalog/import` (avec jeton d'administration).\n\n## Étape 1 : la liste des voitures (Wikidata)\n\nDeux familles, interrogées **séparément** :\n\n- `Q3231690`, « modèle d'automobile », et ses sous-classes : voitures de série ;\n- `Q90834785`, « modèle d'automobile de course », et ses sous-classes : F1, endurance, rallye. Dans Wikidata, ce n'est **pas** une sous-classe de la précédente : une requête sur la première seule oubliait toutes les voitures de course.\n\n```sparql\nSELECT ?car ?links ?img WHERE {\n  ?class wdt:P279* wd:Q3231690 .\n  ?car wdt:P31 ?class ; wikibase:sitelinks ?links ; wdt:P18 ?img .\n  FILTER(?links >= 3)\n}\n```\n\nOn ne garde que les modèles **illustrés** (`P18`) et présents dans **au moins 3 Wikipédias**, ce qui écarte les fiches anecdotiques. Le tri par notoriété et la limite (`CATALOG_IMPORT_LIMIT`, 3 000 par défaut) sont appliqués **dans notre code** : une première version qui triait et regroupait côté Wikidata dépassait leur délai de 60 secondes (erreur 504). Dans nos tests, la requête sur les voitures de course a renvoyé 1 086 modèles en moins d'une seconde.\n\n## Étape 2 : les détails (Wikidata, par lots de 50)\n\n| Donnée | Propriétés Wikidata | Remarque |\n| --- | --- | --- |\n| Nom | libellé fr, sinon en | |\n| Marque | `P1716` (marque), sinon `P176` (constructeur) | « Mercedes-Benz » plutôt que « Mercedes-Benz Group » |\n| Pays | `P495`, sinon pays (`P17`) de la marque ou du constructeur | |\n| Début | min(`P580`, `P571`, `P5204`, `P729`, `P577`) | Les années sont rangées sous des propriétés très variables d'une fiche à l'autre |\n| Fin | max(`P582`, `P2669`, `P576`, `P730`) | |\n| Puissance, vitesse, masse, longueur | `P2109`, `P2052`, `P2067`, `P2043` | Valeurs **normalisées** en unités SI (`psn:`), puis converties ; longueurs aberrantes filtrées |\n| Notoriété | `wikibase:sitelinks` | Sert au calcul de la rareté |\n| Articles | liens vers fr.wikipedia et en.wikipedia | Le français est préféré |\n| Photo | `P18` → nom de fichier Commons | |\n\n`upsertWikidata` crée ou met à jour chaque voiture (clé : `externalId` = QID). Deux cas particuliers :\n\n- **Rattachement des cartes de secours** : une carte `seed:…` dont le titre Wikipédia fr correspond à un résultat Wikidata **prend son QID** au lieu d'être dupliquée. Les collections des joueurs sont conservées.\n- **Photo changée** : si `imageFile` change, la copie locale et ses crédits sont réinitialisés pour être téléchargés de nouveau.\n\nLes raretés sont ensuite recalculées (voir [Moteur de jeu](04-moteur-de-jeu.md#attribution-des-raretés-assignrarities)).\n\n## Étape 3 : les photos (Commons)\n\n`MediaService.syncImages` traite les voitures sans copie locale, par ordre de notoriété et **par lots de 50** :\n\n1. Un appel `action=query&prop=imageinfo` sur commons.wikimedia.org renvoie, pour 50 fichiers d'un coup, l'URL d'une **miniature standard de 960 px** (taille préférée par Wikimedia, car déjà en cache chez eux) et les métadonnées `Artist`, `LicenseShortName` et `LicenseUrl`.\n2. Pour chaque photo : téléchargement de la miniature, puis **sharp** (rotation EXIF, redimensionnement à 640 px, WebP qualité 78, environ 50 à 80 Ko), puis écriture de `cars/\u003cQID>-\u003chash>.webp`.\n3. Mise à jour de la carte : `imagePath`, auteur (HTML nettoyé), licence et URL de la licence.\n\nLe nom de fichier contient le QID, et non le nom du modèle, pour ne pas trahir la réponse du quiz photo. Le suffixe de hachage change si la photo source change, ce qui invalide les caches.\n\n**Cartes de secours** : elles n'ont pas de fichier Commons. `resolveSeedImageFiles` demande à Wikipédia l'image principale de leur article (`prop=pageimages`, par lots de 50), puis le même traitement s'applique.\n\n## Étape 4 : les résumés (Wikipédia)\n\n`syncSummaries` récupère l'introduction en texte brut (`prop=extracts&exintro&explaintext&exsentences=5`) **par lots de 20 articles**, groupés par langue. Si un résumé manque encore à l'affichage d'une fiche, il est récupéré à la volée (API REST, délai court) et mis en cache 30 jours.\n\n## Politesse et robustesse (`catalog/infrastructure/wikimedia/http.ts`)\n\nWikimedia limite fortement les robots, surtout depuis les adresses IP de datacenter. Le client HTTP :\n\n- envoie un **User-Agent identifiable** avec un contact (`WIKI_CONTACT`), comme l'exige leur politique ;\n- respecte un **espacement minimal par domaine** : 1 s pour Wikidata, Commons et Wikipédia, 250 ms pour les miniatures ;\n- en cas de **429, 502, 503 ou 504**, attend la durée indiquée par `Retry-After` (sinon un délai exponentiel), ralentit les requêtes suivantes vers ce domaine, et réessaie jusqu'à 5 ou 6 fois. Chaque attente est consignée dans les logs ;\n- peut envoyer un **jeton Wikimedia** (`WIKIMEDIA_TOKEN`, facultatif) pour bénéficier de limites plus hautes.\n\n**Reprise sur erreur** :\n\n- une erreur **passagère** (403, 429, 5xx, réseau) **interrompt proprement** la synchronisation des médias, sans marquer les cartes en échec. Elle reprendra au prochain démarrage, dans 6 heures ou avec `import-catalog media` ;\n- une erreur **définitive** sur une photo (404, image illisible) marque la carte (`imageCheckedAt`), qui ne sera retentée qu'au bout de 7 jours ;\n- le jeu est **jouable dès l'étape 1**. En attendant sa photo locale, une carte affiche l'image distante (`MEDIA_REMOTE_FALLBACK=true`) ou le dessin technique.\n\n## Suivi\n\n```bash\ndocker compose logs -f api                                  # progression détaillée\ndocker compose exec api node dist/cli/import-catalog stats  # {\"cards\":3000,\"withLocalImage\":2140,\"pendingImages\":820,...}\ncurl -H \"x-admin-token: $ADMIN_TOKEN\" https://monsite/api/admin/catalog/status\n```\n\n## Jeu de secours\n\n`apps/api/src/modules/catalog/infrastructure/seed-cars.ts` contient 115 voitures emblématiques (nom, marque, pays, années, notoriété estimée, titre Wikipédia). Il sert quand Wikidata est injoignable au premier démarrage, et pour les tests. Ces cartes sont rattachées automatiquement aux fiches Wikidata lors d'un import ultérieur.\n\n## Ordres de grandeur\n\nPour 3 000 voitures : environ 60 requêtes Wikidata, 60 appels à l'API Commons et 3 000 téléchargements de miniatures (environ 200 Mo une fois converties). La durée dépend surtout de la tolérance de Wikimedia : quelques dizaines de minutes depuis une connexion classique, beaucoup plus depuis une IP de datacenter bridée.\n"},{"id":"technique/07-api","path":"technique/07-api.md","section":"Technique","title":"7. Référence de l'API","markdown":"# 7. Référence de l'API\n\nToutes les routes sont préfixées par `/api`. Elles demandent une **session** (cookie Better Auth), sauf celles marquées « public ». Les erreurs suivent le format NestJS `{ statusCode, message, error }`, avec des messages en français prêts à afficher.\n\nToutes les actions (`POST`) renvoient `newAchievements` : les succès débloqués pendant la requête, avec leur `reward` (crédits versés).\n\nLe client n'envoie que des **intentions**. Prix, cartes, raretés, gains, dates et bonnes réponses sont décidés par le serveur, et **tout champ non prévu dans le corps ou la requête est refusé (400)**.\n\nCodes courants : `400` entrée invalide ou champ non prévu · `401` non connecté · `403` interdit (dont action envoyée depuis un autre site) · `404` introuvable · `409` conflit de règle (plus de booster, crédits insuffisants, offre déjà prise…) · `429` trop de requêtes · `503` catalogue vide.\n\n## Authentification (Better Auth)\n\n| Méthode | Route | Rôle |\n| --- | --- | --- |\n| POST | `/auth/sign-up/email` | `{ name, email, password }` : inscription et connexion |\n| POST | `/auth/sign-in/email` | `{ email, password }` : connexion |\n| POST | `/auth/sign-out` | Déconnexion |\n| GET | `/auth/get-session` | Session courante |\n\n## Joueur\n\n| Méthode | Route | Réponse |\n| --- | --- | --- |\n| GET | `/me` | `user`, `boosters { available, max, regenMs, nextAt, serverTime }`, `stats` (points, raretés, crédits, compteurs, taille du catalogue…), `pity { epicIn, legendaryIn }` |\n| GET | `/wallet` | `balance`, `earned`, `history[30]` (`label`, `amount`, `balance`, `createdAt`) |\n| GET | `/achievements` | `unlocked`, `total`, `achievements[]` avec `progress`, `reward` et `unlockedAt` |\n\n## Boosters\n\n| Méthode | Route | Réponse |\n| --- | --- | --- |\n| GET | `/boosters` | État de la réserve |\n| POST | `/boosters/open` | `cards[]` (avec `isNew` et `quantity`), `boosters`, `stats`, `newAchievements[]`, `pity { epic, legendary }`. `409` si la réserve est vide |\n\n## Catalogue et collection\n\n| Méthode | Route | Paramètres / réponse |\n| --- | --- | --- |\n| GET | `/collection` | `search`, `rarity`, `manufacturer`, `category` (`racing`/`road`), `owned` (`all`/`owned`/`missing`), `sort` (`rarity`/`name`/`year`/`recent`), `page`, `pageSize` (100 max) → `{ items, page, pages, total }` |\n| GET | `/collection/summary` | Progression par rareté et par constructeur |\n| GET | `/cars/:id` | Carte complète : `summary`, `imageCredit { author, license, licenseUrl, sourceUrl }`, `quantity` |\n| GET | `/media/cars/\u003cfichier>.webp` | Public : photo (cache d'un an, immuable) |\n\nFormat d'une carte : `id, name, manufacturer, country, yearStart, yearEnd, imageUrl, racing, rarity, points, powerHp, topSpeedKmh, massKg, lengthMm, wikiUrl`.\n\n## Mini-jeux\n\n| Méthode | Route | Rôle |\n| --- | --- | --- |\n| GET | `/games` | `resetsAt`, `games[]` (`type`, `name`, `description`, `reward`, `rounds`, `creditsPerWin`, `playsPerDay`, `playsLeft`, `active`, `bestScore`) |\n| POST | `/games/:type/start` | `type` = `DUEL`, `QUIZ`, `WEIGHT`, `MYSTERY` ou `DOORS`. Renvoie la partie (reprise de la partie active s'il y en a une). `409` si plus de partie aujourd'hui |\n| GET | `/games/sessions/:id` | Partie : `round`, `total`, `score`, `credits`, `history[]`, `question` (sans la réponse) |\n| POST | `/games/sessions/:id/answer` | `{ choice }` (`'a'`/`'b'`, `0..3` ou `0..2` selon le jeu) → `correct`, `answer`, `reveal`, `doors` (3 garages), `prize` (carte gagnée), `gained`, `balance`, `session`, `summary` (à la fin : `score`, `credits`, `rewardCard`, `prize`), `newAchievements` |\n\n## Boutique\n\n| Méthode | Route | Rôle |\n| --- | --- | --- |\n| GET | `/shop` | `date`, `hour`, `balance`, `nextRotationAt`, `rules`, `offers[]` (`offerKey`, `price`, `basePrice`, `deal`, `endsAt`, `purchased`, `card`) |\n| POST | `/shop/buy` | `{ offerKey }` → `card`, `balance`, `newAchievements`. `404` si l'offre n'est plus en vente, `409` si déjà achetée ou crédits insuffisants |\n\n## Bourse d'échanges\n\n| Méthode | Route | Rôle |\n| --- | --- | --- |\n| GET | `/trades` | `tab` (`all`/`forme`/`mine`), `search`, `rarity`, `page` → `offers[]` (`offered`, `wanted` ou `price`, `seller`, `sellerIsBot`, `expiresAt`, `mine`, `canAccept`), `balance`, `openLimit`, `market { canTrade, reason, priceFloor, maxSwapRarityGap }` |\n| POST | `/trades` | `{ offeredCarId, wantedCarId }` ou `{ offeredCarId, price }` → `{ id }` (la carte part en séquestre). `409` : compte pas encore admis au marché, prix sous le plancher, raretés trop éloignées |\n| POST | `/trades/:id/accept` | → `card`, `balance`, `newAchievements`, `tradeId` |\n| POST | `/trades/:id/cancel` | Vendeur uniquement ; la carte est rendue |\n\n## Enchères\n\n| Méthode | Route | Rôle |\n| --- | --- | --- |\n| GET | `/auctions` | `tab` (`all`/`selling`/`bidding`), `search`, `rarity`, `page` → `auctions[]` (`card`, `startPrice`, `currentBid`, `minBid`, `bidCount`, `endsAt`, `seller { name, isBot }`, `bidder`, `mine`, `leading`), `balance`, `feePercent`, `durations`, `openLimit`, `market` (comme `/trades`) |\n| POST | `/auctions` | `{ carId, startPrice, durationHours }` → `{ id }` (la carte part en séquestre) |\n| POST | `/auctions/:id/bid` | `{ amount }` → `currentBid`, `minBid`, `endsAt`, `balance`. `400` si sous le minimum, `409` si déjà meilleur enchérisseur ou enchère terminée |\n| POST | `/auctions/:id/cancel` | Vendeur uniquement, tant qu'il n'y a pas d'offre |\n\n## Récompense quotidienne\n\n| Méthode | Route | Rôle |\n| --- | --- | --- |\n| GET | `/daily` | `canClaim`, `streak`, `bestStreak`, `day` (1..7), `resetsAt`, `rewards[7]` |\n| POST | `/daily/claim` | → `day`, `streak`, `reward`, `card` (jour 7), `balance`, `boosters`, `newAchievements`. `409` si déjà réclamée aujourd'hui |\n\n## Notifications push\n\n| Méthode | Route | Rôle |\n| --- | --- | --- |\n| GET | `/push/public-key` | Public : clé VAPID, ou `null` si désactivé |\n| POST | `/push/subscribe` | Abonnement du navigateur (`endpoint`, `keys`) ; l'adresse doit être celle d'un service de notification connu |\n| POST | `/push/unsubscribe` | `{ endpoint }` |\n| POST | `/push/test` | Notification d'essai |\n\n## Administration et exploitation\n\n| Méthode | Route | Rôle |\n| --- | --- | --- |\n| GET | `/health` | Public : `{ status, cards, images }` |\n| GET | `/admin/catalog/status` | En-tête `x-admin-token` : état du catalogue et des médias |\n| POST | `/admin/catalog/import` | En-tête `x-admin-token` ; `{ source: 'wikidata' \\| 'seed' \\| 'media', limit? }` → 202 (tourne en arrière-plan) |\n"},{"id":"technique/08-front","path":"technique/08-front.md","section":"Technique","title":"8. Front-end (Nuxt 4)","markdown":"# 8. Front-end (Nuxt 4)\n\n## Principes\n\n- **Application monopage** (`ssr: false`). Nitro sert les fichiers statiques et le **proxy `/api`** (`server/routes/api/[...path].ts`).\n- **Pas de bibliothèque d'interface** : CSS fait main avec des variables (`app/assets/css/main.css`) et des styles scopés par composant.\n- **État global minimal** avec `useState` : session, joueur (`/me`), notifications à l'écran, état de la PWA.\n- TypeScript strict, vérifié par `nuxt typecheck`.\n\n## Pages\n\n| Page | Fichier | Notes |\n| --- | --- | --- |\n| Accueil | `pages/index.vue` | Cartes de démonstration en éventail |\n| Connexion / inscription | `pages/login.vue`, `register.vue` (via `AuthForm`) | Messages d'erreur Better Auth traduits |\n| Boosters | `pages/boosters.vue` | Réserve, minuteur, garanties, invitation à installer l'application, ouverture |\n| Collection | `pages/collection.vue` | Filtres repris dans l'adresse, pagination |\n| Succès | `pages/achievements.vue` | Groupés par catégorie |\n| Jeux | `pages/games/index.vue` | Parties restantes, remise à zéro |\n| Partie | `pages/games/[id].vue` | Les 5 jeux : paires (Duel, Poids lourds), choix (Quiz, Question pour une carte), portes de garage animées (3 garages) ; repli sur le dessin technique si une image ne charge pas |\n| Marché | `pages/market.vue` | Onglets `MarketShopTab`, `MarketAuctionsTab` et `MarketTradesTab`. Un bandeau 🔒 explique pourquoi un compte n'a pas encore accès à la bourse et aux enchères, et les formulaires de vente affichent le prix minimal de la rareté (valeurs envoyées par le serveur, qui les vérifie de toute façon) |\n| Profil | `pages/profile.vue` | Statistiques, crédits, vitrine de badges, réglages de l'application |\n\nLe middleware `middleware/auth.global.ts` charge la session, redirige vers `/login` (en conservant la page demandée) et précharge `/me`.\n\n## Composants clés\n\n| Composant | Rôle |\n| --- | --- |\n| `CarCard` | La carte : cadre et fond par rareté, photo ou `CarLineArt`, trois caractéristiques, badge 🏁. **Holographie** pour les Épiques et les Légendaires : couche `repeating-linear-gradient` arc-en-ciel en `mix-blend-mode: color-dodge`, dont la position suit le pointeur (`--mx`, `--my`), et reflet radial. Inclinaison 3D par `rotateX/Y`. Toutes les tailles sont en unités `cqw` (`container queries`), donc la carte se met à l'échelle à n'importe quelle taille |\n| `CarLineArt` | Dessin technique SVG (trois profils selon l'époque) |\n| `CardBack` | Dos moderne : compte-tours SVG, trame, bord dégradé ; halo pulsant selon la rareté à venir |\n| `BoosterPack` | Paquet aluminium : bande déchirable, reflet animé, logo |\n| `BoosterOpening` / `MobileReveal` / `FlipCard` | Séquence d'ouverture ; sur mobile, une carte à la fois (toucher, glisser, vibration) |\n| `CardModal` | Fiche détaillée, crédits photo, « Proposer à l'échange » |\n| `market/ShopTab`, `TradesTab`, `TradeCreate`, `AuctionsTab`, `AuctionCreate`, `CardPicker` | Marché |\n| `AppHeader`, `BottomNav`, `BoosterCounter` | Navigation (barre d'onglets à 5 entrées sur mobile) |\n| `ToastHost` | Notifications à l'écran (en haut sur mobile, en bas à droite sur ordinateur) |\n| `InstallCard`, `AppSettings` | Installation de la PWA et notifications |\n\n## Composables\n\n| Composable | Rôle |\n| --- | --- |\n| `api()` / `apiErrorMessage()` | `$fetch` vers `/api` ; un 401 redirige vers la connexion |\n| `useAuthClient()`, `loadSession()`, `signOut()` | Better Auth |\n| `usePlayerState()`, `refreshPlayer()`, `useBoosterTimer()` | État du joueur ; compte à rebours corrigé de l'écart avec l'horloge du serveur, rafraîchi quand un booster arrive |\n| `useToasts()`, `notifyAchievements()`, `setCredits()` | Notifications et mise à jour du solde |\n| `usePwa()`, `haptic()` | Installation, abonnement push, vibrations |\n\n## PWA\n\n- `public/manifest.webmanifest` : nom, icônes (dont une version *maskable*), `display: standalone`, raccourcis.\n- `public/sw.js` (service worker, enregistré seulement en production) :\n  - navigation : réseau d'abord, coquille en cache si hors-ligne ;\n  - `/_nuxt/*`, icônes et polices : cache d'abord (fichiers versionnés) ;\n  - `/api/media/*` : cache d'abord, dans un cache séparé limité à 600 photos ;\n  - reste de `/api/*` : **jamais** mis en cache ;\n  - événements `push` et `notificationclick` (ouvre ou ramène l'application sur la bonne page).\n- Icônes générées à partir du logo SVG (`public/icons/`).\n\n## Responsive\n\nPoint de rupture principal à 860 px. En dessous : barre d'onglets en bas, en-tête compact, filtres repliables. Les zones de sécurité iOS (`env(safe-area-inset-*)`) sont gérées partout où des éléments sont fixes. Testé en émulation iPhone et Pixel (390 × 844) : aucun débordement horizontal.\n"},{"id":"technique/09-deploiement-configuration","path":"technique/09-deploiement-configuration.md","section":"Technique","title":"9. Déploiement et configuration","markdown":"# 9. Déploiement et configuration\n\n## Démarrage avec Docker\n\n```bash\ncp .env.example .env\n# Renseigner au minimum :\n#   BETTER_AUTH_SECRET   (openssl rand -base64 32)\n#   WIKI_CONTACT         (URL ou email : exigé par Wikimedia)\n#   PUBLIC_URL           (https://… en production)\ndocker compose up -d --build\n```\n\n| Service | Image | Rôle | Exposition |\n| --- | --- | --- | --- |\n| `db` | `postgres:17-alpine` | Base de données (volume `pgdata`) | `127.0.0.1:5432` uniquement |\n| `api` | `apps/api/Dockerfile` | NestJS : applique les migrations au démarrage puis lance l'API ; photos dans le volume `media` | réseau interne |\n| `web` | `apps/web/Dockerfile` | Nuxt : interface et proxy `/api` | port `WEB_PORT` (3000) |\n\nLes deux images applicatives sont construites en deux étapes, tournent avec l'utilisateur non-root `node` et partent de `node:22-bookworm-slim`.\n\n## Production\n\n- Placer un **reverse proxy HTTPS** (Caddy, Traefik, Nginx) devant `web`, puis mettre `TRUST_PROXY=true` et `PUBLIC_URL=https://…`. Le HTTPS est indispensable pour l'installation de la PWA et les notifications.\n- **Sauvegarder** les volumes `pgdata` (`pg_dump`) et `media` (les photos peuvent être retéléchargées, mais cela prend du temps).\n- Générer les clés de notification : `npx web-push generate-vapid-keys`.\n- Définir `ADMIN_TOKEN` (16 caractères ou plus) pour l'administration à distance du catalogue.\n\n## Développement local\n\n```bash\ndocker compose up -d db\ncd apps/api && cp .env.example .env && npm install && npx prisma migrate deploy && npm run start:dev   # :3001\ncd apps/web && npm install && npm run dev                                                           # :3000\n```\n\nEn développement, le fichier `.env` de l'API est chargé automatiquement (`process.loadEnvFile`).\n\n## Variables d'environnement\n\n### Essentielles\n\n| Variable | Défaut | Rôle |\n| --- | --- | --- |\n| `BETTER_AUTH_SECRET` | — (**obligatoire**) | Signature des sessions |\n| `PUBLIC_URL` (compose) / `BETTER_AUTH_URL` et `WEB_ORIGIN` (API) | `http://localhost:3000` | URL publique du site |\n| `DATABASE_URL` | construite par compose | Connexion PostgreSQL |\n| `POSTGRES_PASSWORD` | `garage` | Mot de passe de la base |\n| `TRUST_PROXY` | `false` | Lire l'IP du joueur dans `X-Forwarded-For` (seulement derrière un reverse proxy de confiance) |\n| `WEB_PORT`, `DB_PORT` | 3000, 5432 | Ports publiés |\n\n### Jeu\n\n| Variable | Défaut | Rôle |\n| --- | --- | --- |\n| `BOOSTER_REGEN_MINUTES` | 30 | Délai entre deux boosters |\n| `BOOSTER_MAX` | 10 | Taille de la réserve |\n| `BOOSTER_START` | = `BOOSTER_MAX` | Boosters offerts à l'inscription |\n| `CARDS_PER_BOOSTER` | 5 | Cartes par booster |\n| `PITY_EPIC`, `PITY_LEGENDARY` | 10, 60 | Garanties |\n| `GAME_TIMEZONE` | `Europe/Paris` | Fuseau des journées et des rotations |\n| `STARTING_CREDITS` | 100 | Crédits de bienvenue |\n| `GAMES_PER_DAY` | 3 | Parties par jour des jeux à crédits (Duel, Quiz) |\n| `QUICK_GAMES_PER_DAY` | 5 | Parties par jour de Poids lourds et de Question pour une carte |\n| `DOORS_PER_DAY` | 2 | Parties par jour des 3 garages |\n| `TRADE_DAYS`, `MAX_OPEN_TRADES` | 7, 10 | Bourse |\n| `SHOP_SECRET` | dérivé de `BETTER_AUTH_SECRET` | Graine du programme de la boutique |\n| `AUCTION_FEE_PERCENT` | 5 | Commission prélevée sur les ventes aux enchères |\n| `MAX_OPEN_AUCTIONS` | 5 | Enchères en cours par joueur |\n| `MARKET_MIN_ACCOUNT_HOURS` | 24 | Ancienneté minimale d'un compte pour la bourse et les enchères (anti comptes multiples) |\n| `MARKET_MIN_BOOSTERS` | 3 | Boosters ouverts au minimum pour la bourse et les enchères |\n| `TRADE_MAX_RARITY_GAP` | 1 | Écart de rareté maximal d'un échange carte contre carte |\n\n### Bots\n\n| Variable | Défaut | Rôle |\n| --- | --- | --- |\n| `BOTS_ENABLED` | `true` | Active les bots |\n| `BOTS_COUNT` | 12 | Nombre de bots (16 au maximum) |\n| `BOTS_START_CREDITS` | 1500 | Crédits de départ d'un bot |\n| `BOTS_TICK_SECONDS` | 60 | Fréquence de la boucle des bots |\n\n### Tâches de fond\n\n| Variable | Défaut | Rôle |\n| --- | --- | --- |\n| `BACKGROUND_JOBS` | `on` (`off` sous `NODE_ENV=test`) | Règlement des enchères et expiration des offres |\n| `AUCTION_SETTLE_SECONDS` | 30 | Fréquence du règlement des enchères échues |\n| `TRADE_EXPIRE_SECONDS` | 600 | Fréquence de l'expiration des offres de la bourse |\n\n### Catalogue et médias\n\n| Variable | Défaut | Rôle |\n| --- | --- | --- |\n| `CATALOG_AUTO_IMPORT` | `wikidata` | Import au premier démarrage : `wikidata`, `seed` ou `off` |\n| `CATALOG_IMPORT_LIMIT` | 3000 | Nombre maximal de voitures importées |\n| `WIKI_CONTACT` | URL du dépôt | Contact transmis dans le User-Agent |\n| `WIKI_USER_AGENT` | construit à partir de `WIKI_CONTACT` | User-Agent complet (remplace le précédent) |\n| `WIKIMEDIA_TOKEN` | — | Jeton Wikimedia facultatif (limites de débit plus hautes) |\n| `MEDIA_DIR` | `./media` (`/data/media` en Docker) | Dossier des photos |\n| `MEDIA_REMOTE_FALLBACK` | `true` | Afficher l'image distante tant que la copie locale manque |\n| `MEDIA_SYNC_HOURS` | 6 | Fréquence de reprise du rapatriement (0 = jamais) |\n| `MEDIA_SYNC` | `on` | `off` : l'import ne rapatrie ni photos ni résumés (tests) |\n\n### Notifications et administration\n\n| Variable | Défaut | Rôle |\n| --- | --- | --- |\n| `VAPID_PUBLIC_KEY`, `VAPID_PRIVATE_KEY` | — | Clés Web Push (sans elles, les notifications sont désactivées) |\n| `VAPID_SUBJECT` | `mailto:contact@example.com` | Contact Web Push |\n| `PUSH_CHECK_SECONDS` | 60 | Fréquence de vérification des réserves pleines |\n| `ADMIN_TOKEN` | — | Jeton des routes `/api/admin/*` (16 caractères minimum) |\n| `PUSH_ALLOWED_HOSTS` | services Google, Mozilla, Apple, Microsoft | Services de notification autorisés (un nom commençant par `.` autorise ses sous-domaines) |\n\n## Exploitation\n\n| Besoin | Commande |\n| --- | --- |\n| Suivre l'API | `docker compose logs -f api` |\n| État du catalogue | `docker compose exec api node dist/cli/import-catalog stats` |\n| Relancer l'import | `docker compose exec api node dist/cli/import-catalog wikidata 3000` |\n| Reprendre seulement les photos | `docker compose exec api node dist/cli/import-catalog media` |\n| Forcer la rareté d'une carte | `UPDATE car SET \"rarityOverride\" = 'LEGENDARY' WHERE \"externalId\" = 'Q…';` |\n| Retirer une carte du jeu | `UPDATE car SET active = false WHERE …;` (elle n'est plus tirée ni affichée dans le catalogue ; les exemplaires possédés restent en base et comptent toujours dans les statistiques) |\n\n## Limites d'une instance unique\n\nLes tâches de fond (notifications, rapatriement des médias, expiration des offres, règlement des enchères, bots) tournent dans le processus de l'API. Avec **plusieurs instances** de l'API, les verrous et les mises à jour conditionnelles empêchent les doublons sur les données. Les tâches seraient en revanche exécutées par chaque instance. Voir [Évolutions](11-evolutions.md).\n"},{"id":"technique/10-tests-qualite","path":"technique/10-tests-qualite.md","section":"Technique","title":"10. Tests et qualité","markdown":"# 10. Tests et qualité\n\n## Tests automatisés\n\n```bash\ncd apps/api && npm test          # Jest (tests unitaires)\ncd apps/api && npm run test:e2e  # tests de bout en bout : vraie API + base PostgreSQL temporaire\ncd apps/api && npm run lint      # vérification TypeScript (tsc --noEmit)\ncd apps/web && npx nuxt typecheck\n```\n\n| Fichier | Ce qui est vérifié |\n| --- | --- |\n| `shared/domain/credits.spec.ts` | Montants refusés (négatifs, décimaux, démesurés), solde jamais négatif, plafond |\n| `shared/infrastructure/system.spec.ts` | Aléatoire cryptographique dans [0, 1[ |\n| `wallet/domain/wallet.spec.ts` | Journal avec solde résultant, débit refusé sans effet de bord, montants invalides |\n| `collection/domain/booster-reserve.spec.ts` | Réserve vide refusée, régénération avant ouverture, garanties remises à zéro, boosters offerts au-delà du maximum |\n| `games/domain/game-session.spec.ts` | Aucun champ secret dans la vue, fin au premier faux pas, bonus de sans-faute, réponses hors format, cartes gagnées, portes |\n| `marketplace/domain/auction.spec.ts` | Mise en vente validée, offre minimale, surenchère sur soi-même, prolongation, annulation, règlement et commission |\n| `marketplace/domain/market-policy.spec.ts` | Marché fermé aux comptes récents ou inactifs (sauf bots), prix plancher, échanges trop déséquilibrés |\n| `marketplace/domain/trade-offer.spec.ts` | Contrepartie unique, prix bornés, acceptation unique et non expirée, retrait par le vendeur seulement |\n| `progression/domain/daily-streak.spec.ts` | Une réclamation par jour, série continue et cycle de 7 jours, série remise à 1 |\n| `notifications/domain/push-endpoint.spec.ts` | Adresses de notification limitées aux services connus (anti-SSRF) |\n| `collection/domain/booster-clock.spec.ts` | Régénération, plafond, démarrage du minuteur à l'ouverture depuis une réserve pleine, refus sans booster |\n| `catalog/domain/rarity.spec.ts` + `collection/domain/booster-draw.spec.ts` | Répartition du catalogue par notoriété, petits catalogues, carte vedette jamais Commune, garanties Épique et Légendaire, déclenchement au N-ième booster |\n| `shared/domain/seeded.spec.ts` | Mélange déterministe, et bien une permutation |\n| `shared/domain/zoned-time.spec.ts` | Début de journée et heure suivante à Paris, en heure d'été et d'hiver |\n| `marketplace/domain/shop-rotation.spec.ts` | Stabilité dans l'heure, changement à l'heure suivante, aucune Commune répétée dans la journée, Légendaires sur 4 heures, une seule affaire par heure |\n| `catalog/application/media-sync.spec.ts` | Extraction du nom de fichier Commons, nettoyage du HTML des auteurs |\n| `bots/domain/bot-brain.spec.ts` | Valeur estimée (carte manquante, doublons, marque fétiche), jamais d'offre au-delà de la valeur, pas d'offre systématique, échanges équitables uniquement |\n\nLes tests de bout en bout (`test/e2e/`) rejouent automatiquement les scénarios métier et anti-triche ci-dessous : voir [Architecture DDD](13-architecture.md#tests-de-bout-en-bout).\n\n## Vérifications réalisées pendant le développement\n\nCes scénarios ont été rejoués contre une vraie base PostgreSQL, en appelant l'API et en pilotant un navigateur Chromium en émulation mobile.\n\n| Scénario | Résultat attendu, et obtenu |\n| --- | --- |\n| 12 ouvertures simultanées avec 9 boosters | 9 succès, 3 refus |\n| 2 acceptations simultanées de la même offre | 1 succès, 1 refus (409) |\n| 5 achats simultanés de la même offre en boutique | 1 succès, 4 refus, 1 seul débit au journal |\n| Question de mini-jeu envoyée au client | Ne contient pas la réponse |\n| Relance d'une partie en cours | La même partie est reprise |\n| Jeux rapides (Poids lourds, Question pour une carte, 3 garages) | Ni la réponse, ni la carte en jeu, ni le contenu des portes ne sont envoyés avant la réponse ; la carte gagnée est en collection ; limites de 5, 5 et 2 parties par jour respectées |\n| Réponse après la fin de partie / réponse invalide | 409 / 400 |\n| Mise en bourse | La carte quitte la collection (séquestre) ; impossible de la proposer deux fois |\n| Annulation / expiration d'une offre | La carte est rendue au vendeur |\n| Accepter sa propre offre / une offre expirée | 400 / 409 |\n| Achat sans crédits suffisants / offre d'une heure passée | 409 / 404 |\n| Notification « réserve pleine » | Envoyée une seule fois ; abonnement invalide supprimé |\n| `/api/media/../.env` | 403 |\n| Enchères | Offre minimale, refus de surenchérir sur soi-même, remboursement exact du surenchéri, prolongation à 2 min, annulation refusée après une offre, règlement (carte au gagnant, montant − 5 % au vendeur), annulation sans offre |\n| Récompense quotidienne | Jour 1 versé, 2ᵉ réclamation refusée (409), jour 7 = carte Épique + succès de série payés, boosters offerts au-delà de 10 |\n| Bots | 12 bots créés avec personnalités ; ils ouvrent leurs boosters, réclament leur récompense, enchérissent sur les ventes d'un joueur (deux Rares mises à prix 5 montées à 237 et 303), acceptent une offre de bourse, mettent leurs doublons en vente |\n| Écran Marché > Enchères, calendrier de récompenses, badges 🤖 (mobile) | Aucune erreur, aucun débordement |\n| Parcours mobile complet (inscription, booster, jeux, boutique, bourse à deux joueurs) | Aucune erreur, aucun débordement horizontal |\n| Simulation de 300 000 boosters | Probabilités conformes, garanties respectées (voir [Cartes et raretés](../fonctionnel/03-cartes-et-raretes.md)) |\n\n## Ce qui n'a pas pu être vérifié dans l'environnement de développement\n\n- **Construction des images Docker** : pas de démon Docker disponible. La configuration est validée par `docker compose config`, mais les images n'ont jamais été construites.\n- **Téléchargement réel des photos** : l'adresse IP de l'environnement de développement (un datacenter) est bloquée par Wikimedia (`thumb.wikimedia.org` et `upload.wikimedia.org`). La chaîne conversion → stockage → service → crédits a été validée avec une image de test ; l'import Wikidata des données et l'API Commons ont été validés en conditions réelles.\n- **Appareils réels** : l'installation de la PWA et la réception des notifications sur un vrai téléphone.\n\n## Pistes pour aller plus loin\n\n- Tests de bout en bout Playwright dans la CI.\n- Intégration continue GitHub Actions : lint, tests et construction des images.\n"},{"id":"technique/11-evolutions","path":"technique/11-evolutions.md","section":"Technique","title":"11. Évolutions possibles","markdown":"# 11. Évolutions possibles\n\n## Fonctionnelles\n\n| Idée | Intérêt | Base existante |\n| --- | --- | --- |\n| **Amis** et échanges privés | Échanger entre proches, comparer les garages | `trade_offer` (ajouter un destinataire facultatif) |\n| **Achat immédiat** sur les enchères | Vendre vite à un prix garanti | `auction` (ajouter `buyNowPrice`) |\n| **Historique des prix** par carte | Aider à fixer ses prix | Tables `bid`, `trade_offer`, `shop_purchase` |\n| **Profil public** et classement | Émulation, partage | `computePlayerStats` |\n| **Recyclage des doublons** contre des crédits | Valoriser les doublons, nouveau puits/source | `CardsService.take` + `WalletService.credit` |\n| **Boosters thématiques** (par pays, par décennie, 100 % course) | Variété, événements | `CatalogReader.randomCar` (ajouter des filtres) |\n| **Défis quotidiens** (« obtiens une voiture japonaise ») | Raison de revenir chaque jour | Statistiques et succès |\n| **Nouveaux mini-jeux** : « Plus ou moins » sur l'année, devinette de silhouette floutée, mémoire | Variété | `QuestionFactory` (`games/infrastructure/sql-question-factory.ts`) |\n| **Chronomètre** dans le quiz | Limiter la recherche de réponses sur Internet | `game_session.state` |\n| **Événements** (week-end double crédits, booster Légendaire offert) | Animation | `economyConfig` |\n| **Connexion Google / Apple** | Inscription plus rapide | Plugins Better Auth |\n| **Applications des stores** | Visibilité | Envelopper la PWA avec Capacitor |\n\n## Techniques\n\n| Sujet | Recommandation |\n| --- | --- |\n| **Plusieurs instances de l'API** | Déplacer les tâches de fond (notifications, médias, expirations) vers une file (BullMQ et Redis) ou un conteneur « worker » unique ; stocker la limitation de débit de Better Auth en base ou dans Redis |\n| **Stockage des photos** | Passer à un stockage S3 (MinIO, Cloudflare R2) et servir via CDN quand le trafic grandit |\n| **Tests d'intégration et CI** | Voir [Tests et qualité](10-tests-qualite.md) |\n| **Observabilité** | Logs structurés (JSON), métriques (ouvertures, crédits créés et détruits par jour) pour piloter l'économie |\n| **Administration** | Petit back-office : rareté forcée, désactivation de cartes, suivi de l'import, journal des crédits |\n| **Montée de versions** | NestJS 12, Prisma 7+ (nouveau générateur), TypeScript 7 |\n| **Crédits photo** | Afficher aussi l'attribution sur la carte en plein écran ; prévoir une page « Crédits et licences » |\n"},{"id":"technique/12-bots","path":"technique/12-bots.md","section":"Technique","title":"12. Bots : implémentation","markdown":"# 12. Bots : implémentation\n\nRègles du jeu vues par le joueur : [Bots](../fonctionnel/13-bots.md). Ce document décrit le code (`apps/api/src/modules/bots/`).\n\n## Principe\n\nLes bots sont des **joueurs ordinaires** : une ligne `user`, sans ligne `account`, donc sans moyen de se connecter, et une ligne `player` avec `isBot = true`, une personnalité (`botProfile`, JSON) et une heure de prochain passage (`botNextActionAt`). Pour agir, ils appellent **les mêmes cas d'usage que l'API** (`BoostersService`, `DailyRewardService`, `AuctionsService`, `TradesService`). Toutes les règles s'appliquent donc à l'identique : verrous, séquestre, limites, commission, succès et récompenses. Aucune règle n'existe « pour les bots » côté économie, sauf leur dotation de départ (`bot:dotation`) et leur revenu quotidien simulé (`bot:jeux`), tous deux inscrits au journal des crédits via le portefeuille. Ils sont aussi dispensés des conditions d'accès au marché (ancienneté du compte, boosters ouverts), puisqu'ils sont pilotés par le serveur ; les prix planchers et l'écart de rareté des échanges s'appliquent à eux comme aux joueurs.\n\n## Fichiers\n\n| Fichier | Rôle |\n| --- | --- |\n| `domain/bot-brain.ts` | Fonctions **pures**, testées : `botValuation`, `decideBid`, `acceptsPriceOffer`, `acceptsSwap`, `auctionStartPrice`, `tradeAskPrice`, préréglages des personnalités, pseudos |\n| `domain/bot-brain.spec.ts` | Tests : valeur plus haute pour une carte manquante, bonus de marque fétiche, jamais d'offre au-delà de la valeur, pas d'offre systématique, échanges équitables uniquement |\n| `application/bots.service.ts` | Création des bots, boucle d'activité, enchaînement des actions |\n\n## Boucle\n\n```\ntoutes les BOTS_TICK_SECONDS (60 s) :\n  si catalogue vide → rien\n  ensureBots()          crée les bots manquants (jusqu'à BOTS_COUNT), arrivées étalées sur 1 h\n  bots dus = player WHERE isBot AND botNextActionAt ≤ maintenant, au plus 4\n  pour chacun :\n    claimDaily      → DailyRewardService.claim + WalletService.credit(80..320, 'bot:jeux')\n    openBoosters    → BoostersService.open × 1..3 (si réserve)\n    browseAuctions  → 8 enchères les plus proches de la fin, hors les siennes et celles qu'il mène\n                       decideBid(...) → AuctionsService.bid (au plus 2, budget = 60 % du solde)\n    browseTrades    → 10 offres récentes (celles des bots ignorées à 70 %) → TradesService.accept (au plus 1)\n    sellDuplicate   → probabilité sellChance : AuctionsService.create (70 %) ou TradesService.create\n    botNextActionAt = maintenant + activityMinutes × [0,5 ; 1,5] × (4 la nuit)\n```\n\nChaque étape est isolée (`catch`) : une erreur métier (enchère surenchérie entre-temps, plus de crédits…) n'interrompt pas le passage. Un garde (`running`) empêche deux boucles de se chevaucher.\n\n## Personnalités (`STYLE_PRESETS`)\n\n| Style | bidChance | generosity | wantMissing | sellChance |\n| --- | --- | --- | --- | --- |\n| collectionneur | 0,55 | 1,0 | 1,45 | 0,15 |\n| marchand | 0,7 | 0,75 | 1,0 | 0,5 |\n| econome | 0,35 | 0,6 | 1,1 | 0,25 |\n| passionne | 0,45 | 1,15 | 1,3 | 0,2 |\n\nS'y ajoutent, tirés à la création : `activityMinutes` (10 à 45), `favoriteBrand` (70 % des bots, parmi les marques du catalogue) et `likesRacing` (30 %).\n\n## Décisions\n\n```\nvaleur = REF_VALUE[rareté]                          (40, 120, 400, 1200, 4000)\n       × (wantMissing | 0,7 si 1 exemplaire | 0,4 si plusieurs)\n       × 1,3 (marque fétiche) ou 1,8 (marque fétiche d'un passionné)\n       × 1,3 (course, si likesRacing)\n       × generosity × [0,85 ; 1,15]\n\ndecideBid : null si minBid > valeur\n            chance = bidChance × 1,5 (fin \u003c 15 min) × 1,3 (minBid \u003c 60 % de la valeur) × 0,4 (vendeur bot), plafonnée à 95 %\n            montant = min(valeur, minBid + [0 ; 12 %] × minBid)\n```\n\n## Interaction avec l'économie\n\n- **Liquidité** : les bots démarrent avec 1 500 crédits et en gagnent chaque jour (récompense, revenu simulé, succès). Quand ils achètent à un joueur, ils lui transfèrent des crédits : c'est ce qui permet aux premiers joueurs de vendre.\n- **Garde-fous** : budget de 60 % du solde par passage, jamais au-delà de la valeur estimée, préférence pour les offres des joueurs, faible appétit pour les ventes d'autres bots. Ce dernier point évite qu'ils s'échangent des cartes entre eux en boucle.\n- **Puits** : la commission de 5 % des enchères s'applique aussi aux ventes des bots.\n\n## Exploitation\n\n- Arrêt : `BOTS_ENABLED=false` (les bots restent en base, inactifs).\n- Voir l'activité : `SELECT u.name, p.\"boostersOpened\", p.credits FROM player p JOIN \"user\" u ON u.id = p.\"userId\" WHERE p.\"isBot\";`\n- Journal des crédits d'un bot : `credit_transaction` (motifs `bot:jeux`, `auction:*`, `trade:*`, `daily`, `achievement`).\n\n## Pistes\n\n- Réduire progressivement `BOTS_COUNT` en fonction du nombre de joueurs actifs.\n- Activité indexée sur celle des humains (plus d'enchères quand il y a du monde).\n- Mémoire des prix pratiqués, pour affiner les estimations.\n"},{"id":"technique/13-architecture","path":"technique/13-architecture.md","section":"Technique","title":"13. Architecture DDD et hexagonale de l'API","markdown":"# 13. Architecture DDD et hexagonale de l'API\n\nCette page décrit l'architecture de `apps/api` : contextes métier, couches, règles anti-triche, transactions et verrous. Elle retrace aussi les étapes de la refonte.\n\n## Principes\n\n- **Un module NestJS par contexte métier** (*bounded context*). Un module n'expose que ses cas d'usage et ses ports, jamais ses repositories Prisma.\n- **Quatre couches par contexte**, les dépendances allant toujours vers le domaine :\n\n```mermaid\nflowchart LR\n  H[\"http/\u003cbr/>contrôleurs, DTO\"] --> A[\"application/\u003cbr/>cas d'usage, requêtes\"]\n  A --> D[\"domain/\u003cbr/>agrégats, règles, ports\"]\n  I[\"infrastructure/\u003cbr/>Prisma, Wikimedia, Web Push\"] -- implémente les ports --> D\n  A -. \"via les ports\" .-> I\n```\n\n\n| Dossier | Contenu | Dépend de |\n| --- | --- | --- |\n| `domain/` | Agrégats, objets-valeurs, règles, erreurs métier, ports (interfaces), événements de domaine. TypeScript pur : ni NestJS, ni Prisma | rien |\n| `application/` | Cas d'usage (un par action du joueur), orchestration, transaction | `domain/` |\n| `infrastructure/` | Repositories Prisma, mappers, adaptateurs externes (Wikidata, Web Push) | `domain/` et `application/` |\n| `http/` | Contrôleurs et DTO validés | `application/` |\n\n- **Le serveur décide de tout.** Le client n'envoie que des intentions (« ouvrir un booster », « acheter l'offre X », « répondre B »). Prix, raretés, gains, soldes, bonnes réponses et dates sont calculés ou relus côté serveur. Toute donnée envoyée en trop est refusée (400).\n- **Défense en profondeur.** Les DTO valident la forme. Les objets-valeurs du domaine revalident les bornes (`Credits`, quantités…), les agrégats vérifient les règles, et la base garde ses contraintes (unicités, verrous `FOR UPDATE`).\n- **Événements de domaine** plutôt qu'appels croisés. Par exemple, `BoosterOpened` ou `TradeCompleted` déclenchent l'évaluation des succès dans la même transaction, puis les notifications push après validation.\n- **CQRS léger.** Les écritures passent par les agrégats. Les lectures (listes, collection, statistiques) peuvent interroger Prisma directement via des *query services*.\n\n## Contextes\n\n| Contexte | Responsabilité | Agrégats / objets principaux |\n| --- | --- | --- |\n| `shared` | Noyau partagé : transactions, événements, erreurs métier, verrous joueur, horloge, aléatoire | `DomainError`, `Credits`, `PlayerLocks` |\n| `identity` | Authentification (Better Auth), garde global, `@Public()`, `@CurrentUser()` | — |\n| `wallet` | Solde et journal des crédits | `Wallet` |\n| `collection` | Cartes possédées, boosters, tirage, garanties, fiche d'une carte vue par le joueur | `BoosterReserve`, ports `CarPool` et `OwnedCards` |\n| `player` | Création de la fiche joueur à la première requête, profil composé `/me` | `PlayerProvisioning` |\n| `statistics` | Modèle de lecture des statistiques d'un joueur (affichage et succès) | `PlayerStatsQuery` |\n| `progression` | Succès et leurs récompenses, récompense quotidienne | `DailyStreak`, définitions des succès |\n| `games` | Mini-jeux | `GameSession`, `QuestionFactory` (port) |\n| `marketplace` | Boutique, bourse, enchères (et leurs tâches de fond) | `TradeOffer`, `Auction`, rotation de la boutique |\n| `catalog` | Cartes, raretés, import Wikidata, photos, résumés, santé, administration | `CatalogReader`, raretés |\n| `notifications` | Web Push | abonné aux événements |\n| `bots` | Joueurs automatiques | consommateurs des cas d'usage |\n\n### Dépendances entre contextes\n\nUn contexte n'utilise un autre qu'à travers ses services exportés. Une flèche signifie « utilise ». `identity` (sessions) est utilisé partout par le garde global. `player` et `bots` utilisent aussi `wallet`, `catalog` et `statistics`.\n\n```mermaid\nflowchart LR\n  subgraph Entrées\n    player[\"player\u003cbr/>/me, fiche\"]\n    bots[\"bots\"]\n  end\n  subgraph Cœur[\"Contextes de jeu\"]\n    games[\"games\"]\n    marketplace[\"marketplace\"]\n    progression[\"progression\"]\n    collection[\"collection\"]\n  end\n  subgraph Socle[\"Contextes de base\"]\n    wallet[\"wallet\"]\n    catalog[\"catalog\"]\n    statistics[\"statistics\"]\n  end\n  notifications[\"notifications\"]\n  player --> collection\n  player --> progression\n  bots --> marketplace\n  bots --> progression\n  games --> wallet\n  games --> collection\n  marketplace --> wallet\n  marketplace --> collection\n  progression --> wallet\n  progression --> collection\n  collection --> catalog\n  collection --> statistics\n  notifications --> catalog\n```\n\nLes réactions passent par des **événements** : le contexte qui publie ne connaît pas ceux qui écoutent.\n\n```mermaid\nflowchart LR\n  collection -- \"BoosterOpened\" --> progression\n  games -- \"GameRoundPlayed\" --> progression\n  marketplace -- \"ShopCardPurchased\u003cbr/>TradeCompleted\u003cbr/>AuctionSettled\" --> progression\n  marketplace -. \"TradeCompleted · AuctionOutbid · AuctionSettled\u003cbr/>(après validation)\" .-> notifications\n```\n\n## Avancement\n\n| Étape | Contenu | État |\n| --- | --- | --- |\n| 0 | Suite de tests de bout en bout (vraie API, vraie base) qui rejoue les scénarios métier et anti-triche | ✅ |\n| 1 | Socle partagé : transactions (CLS), événements de domaine, erreurs métier, durcissement HTTP | ✅ |\n| 2 | Contextes `wallet`, `collection`, `player` et `statistics` | ✅ |\n| 3 | Contexte `progression` (succès par événements, récompense quotidienne) | ✅ |\n| 4 | Contexte `games` (agrégat `GameSession`, port `QuestionFactory`, aléatoire cryptographique) | ✅ |\n| 5 | Contexte `marketplace` (agrégats `TradeOffer` et `Auction`, boutique), `notifications` (abonnés après validation), `bots` | ✅ |\n| 6 | Contextes `catalog` et `identity`, dotation des bots inscrite au journal, nettoyage final | ✅ |\n\nLa suite de bout en bout est restée verte à chaque étape.\n\n## Où sont faits les contrôles anti-triche\n\nTous les contrôles sont faits **côté serveur**. Une requête modifiée à la main ne peut rien obtenir de plus qu'un clic normal.\n\n| Tentative | Ce qui l'empêche | Couche |\n| --- | --- | --- |\n| Ajouter un champ (prix, carte, gagnant, rareté…) | `forbidNonWhitelisted` : 400 | `http/` (global) |\n| Envoyer un montant négatif, décimal ou énorme | DTO (`@IsInt`, `@Min`, `@Max`), puis `Credits` et `positiveInt` dans le domaine | `http/` + `domain/` |\n| Choisir le contenu d'un booster | Aucun paramètre accepté ; raretés tirées par le serveur (aléatoire cryptographique) | `domain/` |\n| Ouvrir plus de boosters que la réserve | `BoosterReserve.consume` recalcule la réserve à partir de l'heure du serveur, sous verrou | `domain/` |\n| Lire la bonne réponse d'un mini-jeu | `publicQuestion` retire tous les champs secrets ; la réponse ne quitte le serveur qu'après le choix | `domain/` |\n| Deviner la position de la bonne réponse | Mélanges par aléatoire cryptographique | `infrastructure/` |\n| Répondre deux fois, ou à la partie d'un autre | Verrou de la partie, statut vérifié par `GameSession`, partie cherchée par (id, joueur) | `application/` + `domain/` |\n| Acheter en boutique à un autre prix, ou une offre passée | Offres recalculées par le serveur ; seule la clé est envoyée ; unicité (joueur, offre) | `application/` + base |\n| Vendre une carte non possédée, ou deux fois | Séquestre par décrément conditionnel (`CardsService.take`) | `infrastructure/` |\n| Dépenser plus que son solde | `Wallet.debit` (409), sous verrou, avec contrôle optimiste à l'écriture | `domain/` + `infrastructure/` |\n| Accepter sa propre offre, une offre expirée, ou deux fois | `TradeOffer.accept` sous verrou | `domain/` |\n| Transférer cartes ou crédits depuis des comptes jetables | `MarketPolicy` : compte de plus de 24 h ayant ouvert 3 boosters, prix plancher par rareté, échanges entre raretés proches | `domain/` |\n| Surenchérir sous le minimum, sur soi-même, ou après la fin | `Auction.bid` sous verrou | `domain/` |\n| Réclamer deux fois la récompense du jour, ou fausser la série | `DailyStreak.claim` : dates calculées par l'horloge du serveur | `domain/` |\n| Toucher deux fois la récompense d'un succès | `INSERT … ON CONFLICT DO NOTHING RETURNING` avant le paiement | `application/` |\n| Rafales de requêtes | Limitation de débit par joueur (429) | `http/` (global) |\n| Faire agir le joueur depuis un autre site (CSRF) | Contrôle de l'en-tête `Origin` / `Sec-Fetch-Site` sur toutes les actions (403) | `http/` (global) |\n| Faire appeler une adresse interne par le serveur (push) | Liste des services de notification autorisés | `domain/` |\n\n## Socle partagé (`src/shared/`)\n\n| Élément | Rôle |\n| --- | --- |\n| `domain/errors.ts` | `InvalidRequest` (400), `NotFound` (404), `Forbidden` (403), `RuleViolation` (409), `Unavailable` (503). Le domaine lève ces erreurs sans connaître HTTP |\n| `domain/credits.ts`, `domain/guards.ts` | Objet-valeur `Credits` et contrôles de bornes (entiers positifs, plafonds) |\n| `domain/domain-event.ts` | Contrat des événements de domaine (nom stable porté par la classe) |\n| `application/ports.ts` | Ports `UnitOfWork`, `EventBus`, `PlayerLocks`, `Clock`, `RandomSource` |\n| `domain/random.ts`, `domain/seeded.ts`, `domain/zoned-time.ts` | Mélange, aléatoire déterministe (boutique), dates dans le fuseau du jeu |\n| `infrastructure/prisma/transaction.ts` | Accès à la transaction en cours (`Db`) et verrous joueur |\n| `infrastructure/cls-unit-of-work.ts` | Transaction Prisma portée par le contexte de la requête (`nestjs-cls` + `@nestjs-cls/transactional`). Les appels imbriqués rejoignent la transaction en cours. Les événements sont livrés aux abonnés `@OnDomainEvent` dans la transaction, puis aux abonnés `@AfterCommit` après validation |\n| `infrastructure/system.ts` | Horloge système et aléatoire cryptographique (`crypto.randomInt`) |\n| `http/domain-error.filter.ts` | Traduit les erreurs métier en réponses HTTP ; une violation d'unicité en base (double requête) devient un 409 |\n| `http/user-throttler.guard.ts` | Limitation de débit par joueur |\n\n## Exemple : ouverture d'un booster\n\n```\nPOST /api/boosters/open                               (aucun paramètre accepté)\n  BoostersController            http/          compose la réponse (vues des cartes, statistiques)\n  └─ BoostersService.open       application/   unité de travail + verrou joueur\n       ├─ BoosterReserve        domain/        régénération, réserve vide → RuleViolation (409), garanties\n       ├─ rollBoosterRarities   domain/        raretés des 5 emplacements (aléatoire cryptographique)\n       ├─ CardsService.draw     application/   → port CarPool → adaptateur vers CatalogReader\n       ├─ CardsService.grant    application/   → port OwnedCards → Prisma\n       └─ EventBus.publish(BoosterOpened)\n            └─ ProgressionHandlers   (même transaction) → AchievementsService.evaluate\n                 └─ WalletService.credit (récompense) → agrégat Wallet → journal\n  NewAchievementsInterceptor    http/          ajoute newAchievements à la réponse\n```\n\n### Événements de domaine\n\n```mermaid\nsequenceDiagram\n  participant U as Cas d'usage\n  participant B as EventBus\n  participant P as Progression (dans la transaction)\n  participant N as Notifications (après validation)\n  U->>B: publish(TradeCompleted)\n  B->>P: @OnDomainEvent : évalue les succès,\u003cbr/>verse les récompenses (même transaction)\n  P-->>B: ok (une erreur annulerait tout)\n  U->>U: fin du travail\n  Note over U: COMMIT\n  B->>N: @AfterCommit : notification push au vendeur\n```\n\n## Verrous et ordre de verrouillage\n\n- **Joueur** (`PlayerLocks`, ligne `player` en `FOR UPDATE`) : pris par toute action qui modifie le solde, la réserve ou les cartes d'un joueur. Plusieurs joueurs sont toujours verrouillés triés par identifiant.\n- **Objet partagé d'abord** : une offre de la bourse ou une enchère est verrouillée *avant* les joueurs concernés (acceptation, offre, règlement). Aucune action ne prend un joueur puis une offre ou une enchère : pas de cycle, donc pas d'interblocage.\n- **Partie de mini-jeu** : privée, verrouillée *après* son joueur.\n- **Défense en profondeur** : le portefeuille vérifie aussi, à l'écriture, que le solde n'a pas changé depuis sa lecture (concurrence optimiste). La boutique repose en plus sur une contrainte d'unicité (joueur, offre), et le séquestre sur un décrément conditionnel (jamais de quantité négative).\n\n## Tests de bout en bout\n\n```bash\ncd apps/api && npm run test:e2e\n```\n\n- `test/global-setup.ts` crée une base temporaire `garage_e2e_\u003chorodatage>_\u003cpid>` sur le serveur de `E2E_DATABASE_URL` (ou de `DATABASE_URL`). Il y applique les migrations (`prisma migrate deploy`), importe le jeu de cartes de secours et lance l'API compilée sur le port 3101.\n- Pour ce lancement, le serveur tourne avec les tâches de fond accélérées (règlement des enchères et expiratio
