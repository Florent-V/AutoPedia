n des offres toutes les secondes), sans bots, sans import ni appel réseau sortant.\n- Le journal du serveur de test est écrit dans `test/.logs/api.log`.\n- `test/global-teardown.ts` arrête l'API puis supprime **uniquement** la base créée par ce lancement (`E2E_KEEP_DB=1` pour la garder). Aucune base existante n'est modifiée.\n- Les tests passent par l'API comme un vrai client (cookies de session). La base n'est utilisée que pour préparer un état (solde, date d'expiration) et vérifier le résultat.\n\n| Fichier | Scénarios |\n| --- | --- |\n| `security` | 401 sans session, routes publiques, chemins de fichiers, jeton d'administration, identifiants mal formés, champs non prévus, pagination bornée, en-têtes de sécurité, actions envoyées depuis un autre site (CSRF) |\n| `boosters` | Réserve de départ, 12 ouvertures simultanées pour 9 boosters, garantie Épique côté serveur, paramètres de tirage envoyés par le client sans effet |\n| `games` | Aucune réponse divulguée, gains exacts, reprise de partie, réponses hors format, partie d'un autre joueur, cartes gagnées, limites quotidiennes |\n| `shop` | Achat en rafale (1 seul débit), crédits insuffisants, offre inventée, prix envoyé par le client sans effet |\n| `trades` | Séquestre, double acceptation, échange carte contre carte, validation des contreparties, annulation, expiration |\n| `market-guards` | Compte trop récent refusé (vendre, acheter, enchérir), prix plancher, échange trop déséquilibré |\n| `auctions` | Crédits bloqués, remboursement, minimum de surenchère, anti « dernière seconde », règlement, invendu, validation, deux offres simultanées |\n| `daily` | Une réclamation par jour même en rafale, carte du 7ᵉ jour, série remise à 1 |\n| `progression` | Succès signalés dans la réponse et payés une seule fois (rafales d'ouvertures et de consultations), journal du portefeuille |\n| `zz-invariants` | Pour chaque joueur, solde = crédits de départ + somme du journal ; aucun solde ni aucune quantité négatifs |\n\n## Ajouter une fonctionnalité\n\nPour un développeur qui vient de Symfony : un contexte correspond à peu près à un *bundle*. Un cas d'usage correspond à un service applicatif (ou à un *handler* de commande Messenger). Les événements de domaine jouent le rôle des événements Symfony, avec deux moments d'écoute : dans la transaction, ou après validation.\n\n1. **Règle métier** : l'écrire dans l'agrégat ou dans une fonction pure de `domain/`, avec son test unitaire. Lever une erreur métier (`RuleViolation`, `InvalidRequest`…), jamais une exception HTTP.\n2. **Persistance** : déclarer un port (classe abstraite) dans `domain/` et l'implémenter dans `infrastructure/` avec `Db` (transaction en cours).\n3. **Cas d'usage** : dans `application/`, ouvrir `uow.run(...)`, verrouiller (objet partagé puis joueurs), charger, appliquer la règle, enregistrer, puis publier un événement si d'autres contextes doivent réagir.\n4. **Autres contextes** : n'utiliser que leurs services exportés (`WalletService`, `CardsService`, `CatalogReader`…), jamais leurs tables.\n5. **HTTP** : un DTO strict (`class-validator`) et un contrôleur fin qui compose la réponse.\n6. **Test de bout en bout** dans `test/e2e/` : chemin nominal, requêtes invalides ou enrichies, et concurrence si la fonctionnalité touche aux crédits ou aux cartes.\n\n"}]</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js" integrity="sha384-WmdflGW9aGfoBdHc4rRyWzYuAjEmDwMdGdiPNacbwfGKxBW/SO6guzuQ76qjnSlr" crossorigin="anonymous"></script>
<script>
(() => {
  const pages = JSON.parse(document.getElementById('pages').textContent);
  const byId = new Map(pages.map((p) => [p.id, p]));
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const hasMarked = typeof window.marked !== 'undefined';
  const hasMermaid = typeof window.mermaid !== 'undefined';
  if (hasMermaid) mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' });

  // Ancres façon GitHub, pour que les liens « page.md#titre » fonctionnent comme sur GitHub.
  const slug = (text) => text.toLowerCase().trim().replace(/<[^>]+>/g, '').replace(/[^\p{L}\p{N}\- _]/gu, '').replace(/ /g, '-');
  const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  if (hasMarked) {
    marked.use({
      gfm: true,
      renderer: {
        heading(text, level, raw) {
          return '<h' + level + ' id="' + slug(raw) + '">' + text + '</h' + level + '>';
        },
        code(code, lang) {
          if (lang === 'mermaid') return '<pre class="mermaid">' + escapeHtml(code) + '</pre>';
          return '<pre><code>' + escapeHtml(code) + '</code></pre>';
        },
      },
    });
  } else {
    document.getElementById('offline').style.display = 'block';
  }

  // Résout un lien relatif « ../technique/x.md#ancre » depuis la page courante.
  function resolve(fromId, href) {
    const [path, anchor = ''] = href.split('#');
    if (!path) return { id: fromId, anchor };
    const parts = fromId.split('/').slice(0, -1);
    for (const seg of path.split('/')) {
      if (seg === '..') parts.pop();
      else if (seg !== '.') parts.push(seg);
    }
    return { id: parts.join('/').replace(/\.md$/, ''), anchor };
  }

  const nav = document.getElementById('nav');
  function renderNav(filter = '') {
    const q = filter.toLowerCase();
    let html = '';
    let section = '';
    for (const p of pages) {
      if (q && !(p.title + ' ' + p.markdown).toLowerCase().includes(q)) continue;
      if (p.section !== section) {
        section = p.section;
        html += '<h3>' + section + '</h3>';
      }
      html += '<a href="#/' + p.id + '" data-id="' + p.id + '">' + escapeHtml(p.title) + '</a>';
    }
    nav.innerHTML = html || '<p style="color:var(--muted);padding:0 8px">Aucun résultat</p>';
    markActive();
  }
  function markActive() {
    const current = location.hash.slice(2).split('::')[0] || pages[0].id;
    nav.querySelectorAll('a').forEach((a) => a.classList.toggle('on', a.dataset.id === current));
  }

  async function show() {
    const [rawId, anchor] = decodeURIComponent(location.hash.slice(2)).split('::');
    const page = byId.get(rawId) ?? pages[0];
    const content = document.getElementById('content');
    content.innerHTML = hasMarked ? marked.parse(page.markdown) : '<pre>' + escapeHtml(page.markdown) + '</pre>';
    content.querySelectorAll('a[href]').forEach((a) => {
      const href = a.getAttribute('href');
      if (/^(https?:|mailto:)/.test(href)) {
        a.target = '_blank';
        a.rel = 'noopener';
      } else if (href.startsWith('#')) {
        a.href = '#/' + page.id + '::' + href.slice(1);
      } else if (href.includes('.md')) {
        const t = resolve(page.id, href);
        if (byId.has(t.id)) a.href = '#/' + t.id + (t.anchor ? '::' + t.anchor : '');
      }
    });
    const i = pages.indexOf(page);
    const prev = pages[i - 1];
    const next = pages[i + 1];
    document.getElementById('pager').innerHTML =
      (prev ? '<a href="#/' + prev.id + '"><small>← Précédent</small>' + escapeHtml(prev.title) + '</a>' : '<span></span>') +
      (next ? '<a class="next" href="#/' + next.id + '"><small>Suivant →</small>' + escapeHtml(next.title) + '</a>' : '');
    document.title = page.title + ' · Garage';
    markActive();
    document.getElementById('side').classList.remove('open');
    if (hasMermaid) {
      try {
        await mermaid.run({ nodes: content.querySelectorAll('pre.mermaid') });
      } catch (e) {
        console.error(e);
      }
    }
    const target = anchor && document.getElementById(anchor);
    if (target) target.scrollIntoView();
    else window.scrollTo(0, 0);
  }

  // Schéma agrandi : taille réelle, défilable ; clic ou Échap pour fermer.
  const zoom = document.getElementById('zoom');
  document.getElementById('content').addEventListener('click', (e) => {
    const svg = e.target.closest('pre.mermaid svg');
    if (!svg) return;
    const copy = svg.cloneNode(true);
    const width = svg.viewBox?.baseVal?.width || svg.getBoundingClientRect().width;
    copy.style.width = Math.max(width * 1.2, innerWidth - 48) + 'px';
    copy.removeAttribute('height');
    zoom.replaceChildren(copy);
    zoom.classList.add('on');
  });
  zoom.addEventListener('click', () => zoom.classList.remove('on'));
  addEventListener('keydown', (e) => e.key === 'Escape' && zoom.classList.remove('on'));

  document.getElementById('search').addEventListener('input', (e) => renderNav(e.target.value));
  document.getElementById('menu').addEventListener('click', () => document.getElementById('side').classList.toggle('open'));
  addEventListener('hashchange', show);
  renderNav();
  show();
})();
</script>
</body>
</html>
