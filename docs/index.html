<script id="pages" type="application/json">[{"id":"README","path":"README.md","section":"Accueil","title":"Documentation de Garage","markdown":"# Documentation de Garage\n\nGarage est un jeu de collection de cartes sur le thème de l'automobile. Chaque carte est un vrai modèle de voiture (de série ou de course), avec ses données issues de Wikidata, sa photo de Wikimedia Commons et son résumé Wikipédia.\n\n> **Version HTML** : ouvrir [`docs/index.html`](index.html) dans un navigateur (double-clic suffit). Toute la documentation y est réunie, avec un sommaire, une recherche, les schémas dessinés (clic pour agrandir), et les thèmes clair et sombre. Aucune installation n'est nécessaire : la mise en forme vient d'un CDN (jsdelivr), protégée par des empreintes SRI. Après une modification des fichiers Markdown, régénérer la page avec `node docs/build-html.mjs` (Node.js seul, aucune dépendance). Les schémas s'affichent aussi directement sur GitHub (Mermaid).\n\nCette documentation a deux volets :\n\n- **Fonctionnel** : ce que vit le joueur, les règles du jeu et les choix de conception.\n- **Technique** : comment c'est construit, pourquoi, et comment le faire tourner.\n\n## Documentation fonctionnelle\n\n| # | Sujet | Contenu |\n| --- | --- | --- |\n| 1 | [Présentation et parcours joueur](fonctionnel/01-presentation.md) | Concept, boucle de jeu, écrans, glossaire |\n| 2 | [Boosters](fonctionnel/02-boosters.md) | Régénération, réserve, ouverture, garanties |\n| 3 | [Cartes et raretés](fonctionnel/03-cartes-et-raretes.md) | Contenu d'une carte, attribution des raretés, probabilités chiffrées, points |\n| 4 | [Collection](fonctionnel/04-collection.md) | Consultation, filtres, fiche d'une carte, doublons |\n| 5 | [Succès et badges](fonctionnel/05-succes-et-badges.md) | Les 45 succès, les paliers et leurs récompenses en crédits |\n| 6 | [Mini-jeux](fonctionnel/06-mini-jeux.md) | Poids lourds, Question pour une carte, Les 3 garages, Duel de stats, Quiz auto |\n| 7 | [Crédits et économie](fonctionnel/07-credits-et-economie.md) | Sources et dépenses de crédits, équilibre |\n| 8 | [Boutique](fonctionnel/08-boutique.md) | Programme quotidien, rotation horaire, prix, affaire de l'heure |\n| 9 | [Bourse d'échanges](fonctionnel/09-bourse-echanges.md) | Offres, séquestre, acceptation, expiration |\n| 10 | [Application mobile](fonctionnel/10-application-mobile.md) | Installation (PWA), notifications, hors-ligne |\n| 11 | [Enchères](fonctionnel/11-encheres.md) | Mise aux enchères, offres et crédits bloqués, anti « dernière seconde », commission |\n| 12 | [Récompenses régulières](fonctionnel/12-recompenses.md) | Calendrier de 7 jours consécutifs, crédits des succès |\n| 13 | [Bots](fonctionnel/13-bots.md) | Joueurs automatiques qui animent le marché au lancement |\n\n## Documentation technique\n\n| # | Sujet | Contenu |\n| --- | --- | --- |\n| 1 | [Architecture et choix techniques](technique/01-architecture.md) | Stack, organisation du dépôt, flux d'une requête, justification des choix |\n| 2 | [Modèle de données](technique/02-modele-de-donnees.md) | Tables, relations, invariants |\n| 3 | [Authentification et sécurité](technique/03-authentification-securite.md) | Better Auth, sessions, limitations de débit, anti-triche |\n| 4 | [Moteur de jeu](technique/04-moteur-de-jeu.md) | Horloge des boosters, tirage, garanties, verrous |\n| 5 | [Économie : implémentation](technique/05-economie-implementation.md) | Portefeuille, mini-jeux, boutique, bourse, enchères, récompenses |\n| 6 | [Catalogue : import des données](technique/06-catalogue-import.md) | Wikidata, Commons, Wikipédia, politesse, reprise, raretés |\n| 7 | [Référence de l'API](technique/07-api.md) | Toutes les routes |\n| 8 | [Front-end](technique/08-front.md) | Nuxt, pages, composants, design des cartes, service worker |\n| 9 | [Déploiement et configuration](technique/09-deploiement-configuration.md) | Docker, variables d'environnement, exploitation |\n| 10 | [Tests et qualité](technique/10-tests-qualite.md) | Tests automatisés, vérifications manuelles |\n| 11 | [Évolutions possibles](technique/11-evolutions.md) | Pistes et dette connue |\n| 12 | [Bots : implémentation](technique/12-bots.md) | Boucle, personnalités, décisions, garde-fous |\n| 13 | [Architecture DDD et hexagonale](technique/13-architecture.md) | Contextes, couches, règles anti-triche, avancement de la refonte, tests de bout en bout |\n"},{"id":"fonctionnel/01-presentation","path":"fonctionnel/01-presentation.md","section":"Fonctionnel","title":"1. Présentation et parcours joueur","markdown":"# 1. Présentation et parcours joueur\n\n## Le concept\n\nGarage reprend le principe de jeux comme Wiki-Masters ou TCGeo, appliqué aux voitures :\n\n- toutes les 30 minutes, le joueur gagne un **booster**, et il peut en garder **10** en réserve ;\n- chaque booster contient **5 cartes**, et chaque carte est un **vrai modèle de voiture** ;\n- les cartes ont une **rareté**, qui dépend de la célébrité du modèle, et rapportent des **points de collection** ;\n- le but est de **compléter son garage** : collectionner, débloquer des succès, et compléter ce que le hasard ne donne pas grâce aux mini-jeux, à la boutique et à la bourse d'échanges.\n\nLe jeu se joue en solo, mais l'économie (crédits, bourse) relie déjà les joueurs entre eux.\n\n## La boucle de jeu\n\n```mermaid\nflowchart TB\n  T([\"⏱️ 1 booster toutes les 30 min\"]) --> R[\"🎁 Réserve de boosters\u003cbr/>(10 max)\"]\n  R -- ouvrir --> C[\"🃏 5 cartes\"] --> COL[(\"📚 Collection\")]\n  J[\"🎮 Mini-jeux\"] -- crédits --> W[\"🪙 Crédits\"]\n  J -- carte gagnée --> COL\n  D[\"📅 Récompense du jour\"] --> W\n  D -- boosters --> R\n  S[\"🏆 Succès\"] -- crédits --> W\n  W -- achat --> B[\"🏪 Boutique\"] --> COL\n  W -- offre --> E[\"🔨 Enchères\"]\n  COL -- doublons --> M[\"🤝 Bourse\"]\n  COL -- doublons --> E\n  M \u003c--> P((\"Autres joueurs\u003cbr/>et bots 🤖\"))\n  E \u003c--> P\n  COL -. progresse .-> S\n```\n\n1. **Revenir régulièrement** : la réserve se remplit toute seule. Une notification prévient quand elle est pleine.\n2. **Ouvrir ses boosters** : c'est la source principale de cartes.\n3. **Jouer aux mini-jeux** : des jeux rapides pour gagner une carte en un geste, et des jeux de culture automobile pour gagner des crédits.\n4. **Dépenser ses crédits** à la boutique, dont le contenu tourne toutes les heures, ou aux **enchères**.\n5. **Échanger ses doublons** à la bourse contre des cartes manquantes ou des crédits.\n6. **Débloquer des succès**, qui rapportent des crédits, et réclamer sa **récompense quotidienne** pour faire grandir sa série de jours consécutifs.\n\n## Les actions possibles\n\nToutes les actions du joueur sont des **demandes** : le serveur vérifie qu'elles sont permises (réserve, solde, possession de la carte, limites du jour…) et calcule lui-même le résultat. Le joueur ne choisit jamais un prix, une carte ou un gain à la place du jeu.\n\n```mermaid\nflowchart TB\n  J((\"👤 Joueur\"))\n  J --> A1[\"Ouvrir un booster\"]\n  J --> A2[\"Réclamer la récompense du jour\"]\n  J --> A3[\"Lancer un mini-jeu / répondre\"]\n  J --> A4[\"Acheter une offre de la boutique\"]\n  J --> A5[\"Mettre une carte en bourse\u003cbr/>(contre une carte ou des crédits)\"]\n  J --> A6[\"Accepter / retirer une offre de la bourse\"]\n  J --> A7[\"Mettre une carte aux enchères\"]\n  J --> A8[\"Enchérir / annuler son enchère\"]\n  J --> A9[\"Consulter : collection, fiche, succès, portefeuille\"]\n  A1 -. \"réserve > 0\" .-> OK{{\"✔️ vérifié par le serveur\"}}\n  A2 -. \"pas encore réclamée aujourd'hui\" .-> OK\n  A3 -. \"parties restantes, réponse au bon format\" .-> OK\n  A4 -. \"offre de l'heure, solde suffisant, 1 achat par offre\" .-> OK\n  A5 -. \"carte possédée, prix plancher, compte admis au marché\" .-> OK\n  A6 -. \"offre ouverte, pas la sienne, contrepartie disponible\" .-> OK\n  A7 -. \"carte possédée, mise à prix ≥ plancher, durée autorisée\" .-> OK\n  A8 -. \"≥ offre minimale, solde suffisant, enchère en cours\" .-> OK\n```\n\n## Les écrans\n\n| Écran | Accès | Rôle |\n| --- | --- | --- |\n| Accueil | `/` | Présentation du jeu, inscription |\n| Connexion / Inscription | `/login`, `/register` | Email + mot de passe |\n| Boosters | `/boosters` (onglet 1) | Récompense du jour, réserve, compte à rebours, garanties, ouverture |\n| Collection | `/collection` (onglet 2) | Toutes les cartes du catalogue, possédées ou non |\n| Jeux | `/games` (onglet 3) | Liste des mini-jeux et parties restantes |\n| Partie | `/games/:id` | Déroulé d'une partie |\n| Marché | `/market` (onglet 4) | Onglets Boutique, Enchères et Bourse d'échanges |\n| Profil | `/profile` (onglet 5) | Statistiques, crédits, vitrine de badges, réglages de l'application |\n| Succès | `/achievements` | Tous les succès, avec leur progression |\n\nSur téléphone, la navigation se fait par une **barre d'onglets en bas d'écran**. Sur ordinateur, par la barre du haut. L'en-tête affiche toujours la réserve de boosters et le solde de crédits.\n\n## Premier lancement d'un joueur\n\n- **10 boosters** offerts (réserve pleine) ;\n- **100 crédits** de bienvenue ;\n- aucune carte : la collection montre tout le catalogue en silhouettes grises.\n\n## Glossaire\n\n| Terme | Définition |\n| --- | --- |\n| Booster | Paquet de 5 cartes tirées au hasard |\n| Réserve | Nombre de boosters disponibles (10 au maximum) |\n| Rareté | Commune, Peu commune, Rare, Épique, Légendaire |\n| Carte vedette | 5ᵉ carte d'un booster, toujours au moins Peu commune |\n| Garantie | Mécanisme qui assure une Épique au moins tous les 10 boosters et une Légendaire au moins tous les 60 |\n| Points de collection | Somme des points des cartes **différentes** possédées |\n| Crédits (🪙) | Monnaie du jeu, gagnée dans les mini-jeux et à la bourse |\n| Offre | Carte proposée à la bourse contre une autre carte ou des crédits |\n| Enchère | Carte vendue au meilleur enchérisseur à la fin d'une durée choisie |\n| Série | Nombre de jours consécutifs où la récompense quotidienne a été réclamée |\n| Bot 🤖 | Joueur automatique qui anime le marché au lancement |\n| Séquestre | Une carte proposée à la bourse est mise de côté jusqu'à l'échange ou l'annulation |\n"},{"id":"fonctionnel/02-boosters","path":"fonctionnel/02-boosters.md","section":"Fonctionnel","title":"2. Boosters","markdown":"# 2. Boosters\n\n## Régénération\n\n- Un nouveau booster arrive toutes les **30 minutes** (`BOOSTER_REGEN_MINUTES`).\n- La réserve est plafonnée à **10 boosters** (`BOOSTER_MAX`).\n- **Quand la réserve est pleine, le compteur s'arrête.** Il repart dès qu'on ouvre un booster. On ne « perd » donc rien à ouvrir, mais on perd du temps de régénération en laissant la réserve pleine.\n- À partir d'une réserve vide, il faut 5 heures pour la remplir. C'est le rythme que vise le jeu : deux ou trois visites par jour.\n\nDans l'en-tête et sur la page Boosters, le joueur voit :\n\n- le nombre de boosters disponibles (« 7/10 ») ;\n- le temps restant avant le prochain booster, avec une barre de progression, ou « réserve pleine » ;\n- les **garanties** en cours (« Épique garantie dans 4 boosters », « Légendaire garantie dans 37 »).\n\nLa **récompense quotidienne** offre aussi des boosters (1, 2 ou 3 selon le jour), qui s'ajoutent à la réserve **même au-delà de 10**. Voir [Récompenses](12-recompenses.md).\n\nUne **notification** (si le joueur l'a activée) prévient quand la réserve vient d'être remplie. Une seule notification est envoyée par remplissage, et aucune toutes les 30 minutes.\n\n## Ouverture\n\n1. Le joueur touche un booster (ou le bouton « Ouvrir un booster »).\n2. Le booster tremble ; le joueur le touche pour le **déchirer**.\n3. Les cartes apparaissent face cachée. Le dos d'une carte **Rare, Épique ou Légendaire brille** et pulse avant d'être retourné : le suspense fait partie du plaisir.\n4. Révélation :\n   - **sur téléphone**, carte par carte : on touche pour retourner la carte, puis on glisse ou on touche pour passer à la suivante. Le téléphone vibre sur les cartes rares (Android) ;\n   - **sur ordinateur**, les 5 cartes en ligne, à retourner une par une ou toutes d'un coup (« Tout révéler »).\n5. Récapitulatif : nombre de nouvelles cartes, points gagnés, puis les boutons « Ouvrir un autre booster », « Voir ma collection » et « Fermer ».\n6. Les **succès** débloqués s'affichent en notification.\n\nLes cartes reçues sont ajoutées à la collection. Un doublon augmente simplement le nombre d'exemplaires (×2, ×3…).\n\n```mermaid\nsequenceDiagram\n  actor J as Joueur\n  participant S as Serveur\n  J->>S: « Ouvrir un booster » (aucun paramètre)\n  S->>S: recalcule la réserve avec l'heure du serveur\n  alt réserve vide\n    S-->>J: refus « Aucun booster disponible »\n  else au moins 1 booster\n    S->>S: tire les 5 raretés (garanties incluses)\u003cbr/>puis 5 cartes différentes\n    S->>S: ajoute les cartes à la collection,\u003cbr/>met à jour la réserve et les compteurs\n    S->>S: vérifie les succès débloqués\n    S-->>J: 5 cartes, réserve, succès\n  end\n```\n\n## Contenu d'un booster\n\n| Emplacement | Raretés possibles |\n| --- | --- |\n| Cartes 1 à 4 | Toutes, selon les probabilités « normales » |\n| Carte 5 (vedette) | Peu commune ou mieux |\n\nUn même booster ne contient jamais deux fois la même carte, sauf si le catalogue est trop petit pour l'éviter.\n\nLes probabilités détaillées sont dans [Cartes et raretés](03-cartes-et-raretes.md).\n\n## Garanties (« pity »)\n\nLe hasard pur peut être cruel : une simulation de 200 000 boosters sans garantie montrait jusqu'à **39 boosters d'affilée sans Épique** et **plus de 200 sans Légendaire**. Pour éviter ces séries frustrantes :\n\n- **Épique garantie** : si aucun des 9 derniers boosters n'a contenu d'Épique ou de Légendaire, le 10ᵉ en contient une (`PITY_EPIC=10`). Elle est Légendaire une fois sur cinq.\n- **Légendaire garantie** : si aucun des 59 derniers boosters n'a contenu de Légendaire, le 60ᵉ en contient une (`PITY_LEGENDARY=60`).\n\nLa garantie ne s'applique que si le tirage normal ne l'a pas déjà satisfaite. Le compteur repart à zéro dès qu'une carte de la rareté visée sort, que ce soit naturellement ou grâce à la garantie. Seuls les boosters comptent : les cartes gagnées en boutique, à la bourse ou dans les mini-jeux ne remettent pas le compteur à zéro.\n"},{"id":"fonctionnel/03-cartes-et-raretes","path":"fonctionnel/03-cartes-et-raretes.md","section":"Fonctionnel","title":"3. Cartes et raretés","markdown":"# 3. Cartes et raretés\n\n## Ce que montre une carte\n\n```\n┌──────────────────────────────┐\n│ Ferrari F40              [L] │  ← nom + pastille de rareté\n│ ┌──────────────────────────┐ │\n│ │  photo (ou dessin        │ │  ← photo Wikimedia, sinon dessin technique\n│ │  technique du modèle)    │ │     (3 silhouettes selon l'époque)\n│ └──────────────────────────┘ │\n│ Ferrari                      │  ← marque\n│ Italie · 1987–1992           │  ← pays · années de production\n│ [478 ch] [324 km/h] [1 100kg]│  ← 3 caractéristiques disponibles\n│ LÉGENDAIRE            100 PTS│  ← rareté + points\n└──────────────────────────────┘\n```\n\n- **Caractéristiques** : parmi la puissance, la vitesse maximale, la masse et la longueur, la carte affiche les **trois premières disponibles**. Wikidata est inégalement renseigné : la puissance est rare, la longueur et la masse sont fréquentes.\n- **Photo** : celle de Wikimedia Commons, stockée sur notre serveur. À défaut, un **dessin technique** façon plan, sur une grille, aux couleurs de la rareté, avec trois profils selon l'époque (avant 1950, de 1950 à 1989, après 1990).\n- **Badge 🏁** : la voiture est une voiture de course (F1, endurance, rallye…).\n- **Fiche détaillée** (au toucher) : toutes les données, le résumé Wikipédia, le lien vers l'article, les **crédits de la photo** (auteur, licence) et le bouton « Proposer à l'échange ».\n\n## Les 5 raretés\n\n| Rareté | Couleur | Points | Effet visuel |\n| --- | --- | --- | --- |\n| Commune | Gris | 1 | — |\n| Peu commune | Vert | 3 | — |\n| Rare | Bleu | 10 | Halo bleu au dos avant révélation |\n| Épique | Violet | 30 | **Holographique** (reflet arc-en-ciel qui suit le doigt ou la souris, inclinaison 3D) |\n| Légendaire | Or | 100 | **Holographique** + paillettes animées + halo doré |\n\n## Comment une voiture devient rare : la notoriété\n\nLa rareté **ne dépend pas d'un choix manuel** : elle vient de la **notoriété** du modèle, mesurée par le **nombre d'éditions de Wikipédia** (toutes langues confondues) qui lui consacrent un article. C'est une donnée objective et disponible pour tous les modèles. Une Ford T ou une Coccinelle ont des articles dans plus de 60 langues ; un modèle obscur n'en a que 3.\n\nLe catalogue est trié de la plus célèbre à la moins célèbre, puis découpé :\n\n| Rareté | Part du catalogue | Exemple pour 3 000 voitures |\n| --- | --- | --- |\n| Légendaire | les 2 % les plus célèbres | 60 cartes |\n| Épique | les 6 % suivants | 180 cartes |\n| Rare | les 15 % suivants | 450 cartes |\n| Peu commune | les 27 % suivants | 810 cartes |\n| Commune | les 50 % restants | 1 500 cartes |\n\nConséquences voulues :\n\n- les voitures **mythiques** (Ford T, Coccinelle, 2CV, Bugatti Veyron, Porsche 911…) sont les plus rares, donc les plus désirables ;\n- la rareté est **recalculée à chaque import** du catalogue : elle suit l'évolution de Wikipédia ;\n- un administrateur peut **forcer** la rareté d'une carte (colonne `rarityOverride`). Les imports ne l'écrasent jamais.\n\n## Probabilités de tirage\n\n### Par emplacement\n\n| Rareté | Cartes 1 à 4 | Carte 5 (vedette) |\n| --- | --- | --- |\n| Commune | 62 % | — |\n| Peu commune | 26 % | 55 % |\n| Rare | 9 % | 33 % |\n| Épique | 2,5 % | 9,5 % |\n| Légendaire | 0,5 % | 2,5 % |\n\nUne fois la rareté tirée, la carte est choisie **uniformément** parmi les cartes de cette rareté.\n\n### Résultats mesurés (simulation de 300 000 boosters, garanties incluses)\n\n| Indicateur | Valeur |\n| --- | --- |\n| Part des cartes obtenues : Commune / Peu commune / Rare / Épique / Légendaire | 49,5 % / 31,6 % / 13,7 % / 4,2 % / 1,0 % |\n| Boosters contenant au moins une Rare | 68 % |\n| Boosters contenant au moins une Épique | 24 % (environ 1 sur 4) |\n| Boosters contenant une Légendaire | 5,1 % (environ 1 sur 20) |\n| Pire série sans Épique | 9 boosters (garantie) |\n| Pire série sans Légendaire | 59 boosters (garantie) |\n\n### Est-ce bien réglé ?\n\n- **Rythme** : un joueur assidu ouvre environ 15 à 25 boosters par jour. Il voit donc une Légendaire tous les un ou deux jours, et plusieurs Épiques par jour. Les moments forts sont réguliers sans devenir banals.\n- **Compléter le catalogue** prend des mois avec les seuls boosters : pour obtenir les 60 Légendaires, il faut statistiquement environ 280 tirages de Légendaires, soit des milliers de boosters. C'est voulu, et c'est là qu'interviennent la **boutique** (qui permet de cibler une rareté) et la **bourse** (qui permet d'échanger ses doublons).\n- **Avant correction**, la variance posait problème (jusqu'à 200 boosters sans Légendaire). Les **garanties** l'ont corrigée.\n- Tous les réglages sont centralisés dans `apps/api/src/modules/catalog/domain/rarity.ts` (raretés, poids de tirage), `apps/api/src/modules/collection/domain/booster-draw.ts` (garanties) et dans les variables `PITY_*`.\n\n## Points de collection\n\nLe score d'un joueur est la **somme des points de ses cartes différentes**. Les doublons ne comptent pas dans le score, mais ils servent à la bourse. Donner son dernier exemplaire d'une carte fait donc baisser le score.\n"},{"id":"fonctionnel/04-collection","path":"fonctionnel/04-collection.md","section":"Fonctionnel","title":"4. Collection","markdown":"# 4. Collection\n\nLa page Collection affiche **tout le catalogue** :\n\n- les cartes possédées en couleur, avec le nombre d'exemplaires (×2, ×3…) ;\n- les cartes manquantes en **silhouette grise** : le nom reste visible, mais pas la photo. Le joueur sait ainsi ce qu'il lui reste à trouver.\n\n## Progression\n\nEn haut de la page :\n\n- le total « cartes possédées / cartes du catalogue », le pourcentage de complétion et les points de collection ;\n- une **jauge par rareté** (par exemple « Rare 12/450 »). Toucher une jauge filtre la collection sur cette rareté.\n\n## Filtres et tri\n\n| Filtre | Valeurs |\n| --- | --- |\n| Recherche | Nom du modèle ou de la marque |\n| Constructeur | Liste des marques, avec la progression pour chacune (« Ferrari (3/41) ») |\n| Catégorie | Route et course, voitures de route, voitures de course 🏁 |\n| Possession | Toutes, possédées, manquantes |\n| Tri | Rareté (par défaut), nom, année, ajout au catalogue |\n\nSur téléphone, les filtres sont repliés derrière un bouton « Filtres (n) » qui indique le nombre de filtres actifs, et les jauges de rareté défilent horizontalement.\n\nLes filtres sont repris dans l'adresse de la page : on peut partager ou mettre en favori une vue filtrée.\n\n## Fiche d'une carte\n\nToucher une carte ouvre sa fiche :\n\n- la carte en grand, interactive (inclinaison, reflets holographiques) ;\n- la marque, le pays, les années de production, la catégorie (route ou course), la masse, la longueur, la puissance, la vitesse et le nombre d'exemplaires ;\n- pour une carte possédée : le **résumé Wikipédia**, le lien vers l'article, les **crédits de la photo** (auteur, licence, lien vers Commons) et le bouton **« Proposer à l'échange »**, qui ouvre la bourse avec la carte présélectionnée ;\n- pour une carte manquante : une invitation à ouvrir des boosters. Le résumé reste caché pour garder la surprise.\n"},{"id":"fonctionnel/05-succes-et-badges","path":"fonctionnel/05-succes-et-badges.md","section":"Fonctionnel","title":"5. Succès et badges","markdown":"# 5. Succès et badges\n\nLes succès récompensent la progression dans toutes les dimensions du jeu. Chaque succès débloqué donne un **badge**, une médaille dont la couleur dépend du palier.\n\n## Fonctionnement\n\n- Chaque succès associe une **statistique** du joueur à un **objectif** (par exemple « boosters ouverts ≥ 50 »).\n- Les succès sont vérifiés automatiquement après chaque action qui peut les faire progresser : ouverture d'un booster, fin d'une partie de mini-jeu (y compris une carte gagnée), achat en boutique, échange à la bourse. Pour un échange, la vérification se fait **pour les deux joueurs**.\n- Un succès débloqué l'est définitivement, même si la statistique baisse ensuite (par exemple si le joueur donne des cartes).\n- Le joueur est prévenu par une notification à l'écran, qui indique aussi la récompense.\n- **Chaque succès rapporte des crédits**, versés automatiquement au déblocage, selon son palier (voir ci-dessous). C'est une source régulière de crédits tout au long de la vie du joueur, pour enchérir ou acheter en boutique.\n\n## Paliers et récompenses\n\n| Palier | Médaille | Difficulté | Récompense |\n| --- | --- | --- | --- |\n| Bronze | cuivrée | Premiers pas, quelques jours de jeu | 50 🪙 |\n| Argent | argentée | Joueur régulier | 150 🪙 |\n| Or | dorée, avec halo | Joueur investi | 400 🪙 |\n| Platine | bleu irisé, avec halo | Objectif au long cours | 1 000 🪙 |\n\nLa récompense n'est versée qu'une fois par succès, même si deux actions le débloquent au même instant (l'insertion du succès en base sert de verrou).\n\n## Où les voir\n\n- **Page Succès** (`/achievements`, accessible depuis le profil) : tous les succès groupés par catégorie, avec une barre de progression pour ceux qui restent à débloquer, la récompense, et la date d'obtention pour les autres.\n- **Vitrine de badges** sur le profil : les badges obtenus.\n\n## Liste des 45 succès\n\n### Boosters\n\n| Badge | Nom | Condition | Palier | Récompense |\n| --- | --- | --- | --- | --- |\n| 🎁 | Premier contact | Ouvrir votre premier booster | Bronze | 50 🪙 |\n| 🔑 | Mise en route | Ouvrir 10 boosters | Bronze | 50 🪙 |\n| ⚙️ | Rodage terminé | Ouvrir 50 boosters | Argent | 150 🪙 |\n| 🛣️ | Grand tourisme | Ouvrir 200 boosters | Or | 400 🪙 |\n| 🛞 | Million de kilomètres | Ouvrir 1 000 boosters | Platine | 1000 🪙 |\n\n### Collection\n\n| Badge | Nom | Condition | Palier | Récompense |\n| --- | --- | --- | --- | --- |\n| 🏠 | Petit garage | Posséder 10 cartes différentes | Bronze | 50 🪙 |\n| 🏪 | Concession | Posséder 50 cartes différentes | Bronze | 50 🪙 |\n| 🅿️ | Parc automobile | Posséder 150 cartes différentes | Argent | 150 🪙 |\n| 🏛️ | Musée de l’automobile | Posséder 500 cartes différentes | Or | 400 🪙 |\n| 📚 | Encyclopédie vivante | Posséder 1 000 cartes différentes | Platine | 1000 🪙 |\n| 🚕 | Flotte de société | Posséder 5 exemplaires d’une même carte | Bronze | 50 🪙 |\n\n### Rareté\n\n| Badge | Nom | Condition | Palier | Récompense |\n| --- | --- | --- | --- | --- |\n| 💎 | Coup de chance | Obtenir une carte Rare | Bronze | 50 🪙 |\n| 🔮 | Pièce de collection | Obtenir une carte Épique | Argent | 150 🪙 |\n| 👑 | Légende vivante | Obtenir une carte Légendaire | Or | 400 🪙 |\n| 🎩 | Salon privé | Posséder 10 cartes Épiques différentes | Or | 400 🪙 |\n| 🏆 | Panthéon | Posséder 5 cartes Légendaires différentes | Platine | 1000 🪙 |\n\n### Exploration\n\n| Badge | Nom | Condition | Palier | Récompense |\n| --- | --- | --- | --- | --- |\n| 🔧 | Fidèle à la marque | Posséder 5 cartes d’un même constructeur | Bronze | 50 🪙 |\n| 🛠️ | Spécialiste | Posséder 15 cartes d’un même constructeur | Argent | 150 🪙 |\n| 🗺️ | Tour d’Europe | Posséder des voitures de 5 pays différents | Bronze | 50 🪙 |\n| 🌍 | Tour du monde | Posséder des voitures de 12 pays différents | Argent | 150 🪙 |\n| 🏁 | Paddock | Posséder 5 voitures de course | Argent | 150 🪙 |\n| 🏎️ | Écurie officielle | Posséder 20 voitures de course | Or | 400 🪙 |\n| ⏳ | Voyage dans le temps | Posséder des voitures de 6 décennies différentes | Argent | 150 🪙 |\n\n### Mini-jeux\n\n| Badge | Nom | Condition | Palier | Récompense |\n| --- | --- | --- | --- | --- |\n| 🎮 | Échauffement | Terminer une partie de mini-jeu | Bronze | 50 🪙 |\n| 🕹️ | Pilote d’essai | Terminer 25 parties de mini-jeux | Argent | 150 🪙 |\n| 🧠 | Encyclopédiste | Terminer 100 parties de mini-jeux | Or | 400 🪙 |\n| 🎴 | Butin | Gagner 10 cartes dans les mini-jeux | Bronze | 50 🪙 |\n| 🏅 | Chasseur de trophées | Gagner 100 cartes dans les mini-jeux | Or | 400 🪙 |\n| 🚪 | Bonne porte | Trouver la carte Épique ou Légendaire des 3 garages | Argent | 150 🪙 |\n| 💰 | Tirelire | Gagner 1 000 crédits au total | Argent | 150 🪙 |\n| 🏦 | Coffre-fort | Gagner 10 000 crédits au total | Or | 400 🪙 |\n\n### Marché\n\n| Badge | Nom | Condition | Palier | Récompense |\n| --- | --- | --- | --- | --- |\n| 🛒 | Premier achat | Acheter une carte à la boutique | Bronze | 50 🪙 |\n| 🛍️ | Client fidèle | Acheter 10 cartes à la boutique | Argent | 150 🪙 |\n| 🤝 | Poignée de main | Conclure un échange à la bourse | Bronze | 50 🪙 |\n| 📈 | Négociant | Conclure 10 échanges à la bourse | Argent | 150 🪙 |\n| 💼 | Courtier | Conclure 50 échanges à la bourse | Or | 400 🪙 |\n| 🔨 | Adjugé ! | Remporter une enchère | Bronze | 50 🪙 |\n| 🏛️ | Collectionneur averti | Remporter 10 enchères | Or | 400 🪙 |\n| 📣 | Commissaire-priseur | Vendre 5 cartes aux enchères | Argent | 150 🪙 |\n\n### Assiduité\n\n| Badge | Nom | Condition | Palier | Récompense |\n| --- | --- | --- | --- | --- |\n| 📅 | Bonne habitude | Se connecter 3 jours d’affilée | Bronze | 50 🪙 |\n| 🗓️ | Habitué du garage | Se connecter 7 jours d’affilée | Argent | 150 🪙 |\n| 🔥 | Fidèle au poste | Se connecter 30 jours d’affilée | Platine | 1000 🪙 |\n\n### Score\n\n| Badge | Nom | Condition | Palier | Récompense |\n| --- | --- | --- | --- | --- |\n| ⛽ | Plein d’essence | Atteindre 100 points de collection | Bronze | 50 🪙 |\n| 🥇 | Pole position | Atteindre 1 000 points de collection | Argent | 150 🪙 |\n| 🏎️ | Champion du monde | Atteindre 5 000 points de collection | Or | 400 🪙 |\n\nAu total  débloquer tous les succès rapporte **11 400 crédits**.\n\n## Ajouter un succès\n\nLes succès sont déclarés dans `apps/api/src/modules/progression/domain/achievements.ts`. Ajouter une ligne suffit, à condition que la statistique existe déjà (voir `PlayerStats` dans `apps/api/src/modules/statistics/player-stats.ts`). La progression, le déblocage, la récompense et l'affichage sont automatiques. Pour une nouvelle statistique, il faut l'ajouter au calcul de `computePlayerStats` (`player-stats.query.ts`).\n"},{"id":"fonctionnel/06-mini-jeux","path":"fonctionnel/06-mini-jeux.md","section":"Fonctionnel","title":"6. Mini-jeux","markdown":"# 6. Mini-jeux\n\nLes mini-jeux mettent en valeur les données du catalogue : on apprend des choses sur les voitures en jouant. Il y en a deux familles :\n\n| Famille | Jeux | Récompense | Parties par jour |\n| --- | --- | --- | --- |\n| **Jeux rapides** | ⚖️ Poids lourds · 🃏 Question pour une carte · 🚪 Les 3 garages | **Une carte**, gagnée en une seule action | 5 · 5 · 2 |\n| **Jeux à crédits** | ⚔️ Duel de stats · 🧠 Quiz auto | **Des crédits** à chaque bonne réponse, plus une carte bonus pour un sans-faute | 3 · 3 |\n\n## Règles communes\n\n- **Un nombre de parties par jour propre à chaque jeu** : 3 pour les jeux à crédits (`GAMES_PER_DAY`), 5 pour Poids lourds et Question pour une carte (`QUICK_GAMES_PER_DAY`), 2 pour les 3 garages (`DOORS_PER_DAY`). Le compteur repart à **minuit, heure de Paris** (`GAME_TIMEZONE`). La page Jeux affiche les parties restantes (pastilles vertes) et le temps avant les nouvelles parties.\n- **Une partie commencée compte**, même abandonnée. Revenir sur le jeu **reprend la partie en cours**, dans l'heure qui suit : impossible de relancer une partie pour tomber sur des questions plus faciles. Passé ce délai, la partie est considérée comme abandonnée.\n- Jeux à crédits : les **crédits sont gagnés à chaque bonne réponse**, immédiatement, donc abandonner en cours de route ne fait pas perdre ce qui est acquis. **Sans-faute = carte bonus**, tirée comme une carte vedette de booster (Peu commune ou mieux).\n- Jeux rapides : la carte gagnée rejoint immédiatement la collection, comme une carte de booster.\n- Le **meilleur score** des jeux à crédits est affiché.\n- Toutes les réponses sont vérifiées par le serveur : voir [Sécurité](../technique/03-authentification-securite.md#anti-triche).\n\n## Déroulé d'une partie\n\nLa bonne réponse reste sur le serveur : l'écran ne reçoit que la question et les choix. Elle n'est révélée qu'après la réponse.\n\n```mermaid\nflowchart TD\n  S[\"Lancer un jeu\"] --> L{\"Parties restantes\u003cbr/>aujourd'hui ?\"}\n  L -- non --> N[\"Revenir demain\"]\n  L -- \"oui (ou partie en cours reprise)\" --> Q[\"Question tirée par le serveur\"]\n  Q --> R[\"Le joueur répond\"]\n  R --> V{\"Bonne réponse ?\"}\n  V -- oui --> G[\"Gain : crédits ou carte\"]\n  V -- non --> F{\"Le jeu s'arrête\u003cbr/>à la première erreur ?\"}\n  G --> E{\"Dernière manche ?\"}\n  F -- oui --> FIN[\"Fin de partie\"]\n  F -- non --> E\n  E -- non --> Q\n  E -- oui --> P{\"Sans-faute ?\"}\n  P -- \"oui (Duel, Quiz)\" --> B[\"Carte bonus\"] --> FIN\n  P -- non --> FIN\n  FIN --> SU[\"Succès vérifiés\"]\n```\n\n## ⚖️ Poids lourds\n\n> « Laquelle est la plus lourde ? »\n\n- Deux voitures sur la balance, un seul toucher : **la plus lourde est à vous** si vous la désignez.\n- La rareté de chacune des deux voitures est tirée **comme une carte de booster** (62 % Commune… 0,5 % Légendaire) : la valeur moyenne d'une victoire reste comparable à celle d'une carte de booster. La rareté est affichée sous chaque voiture, ce qui ajoute un dilemme : faut-il miser sur ce qu'on sait, ou sur ce qu'on veut ?\n- Les deux masses diffèrent toujours d'au moins 8 %. Elles sont révélées après la réponse (« 1 422 kg » contre « 1 768 kg »).\n- Si le catalogue manque de masses connues, la question porte sur un autre critère du Duel de stats (vitesse, longueur…). C'est rare avec le catalogue complet.\n\n## 🃏 Question pour une carte\n\n> Une carte, une question, quatre réponses. Bonne réponse = carte gagnée.\n\nLa carte en jeu est **visible** (photo, nom, marque, rareté). Sa rareté est tirée comme une carte de booster. Tout le sel du jeu est dans le choix de la question : ni trop facile ni trop difficile. La règle retenue est que **la difficulté suit la valeur de la carte** :\n\n| Rareté en jeu | Question | Pourquoi |\n| --- | --- | --- |\n| Commune, Peu commune | « De quel pays vient cette voiture ? » | La marque est visible et aide souvent (Lamborghini → Italie), mais les marques moins connues ou délocalisées gardent du piquant |\n| Rare | « En quelle décennie est-elle sortie ? » (4 décennies consécutives) | Demande une vraie culture automobile ; le style de la voiture sur la photo donne des indices |\n| Épique, Légendaire | « En quelle année est-elle sortie ? » (4 années à quelques années d'écart) | Les cartes les plus précieuses se méritent ; les voitures célèbres sont aussi celles dont on connaît la date |\n\nSi une donnée manque (année inconnue…), la question se rabat sur la décennie puis sur le pays. En cas d'erreur, la bonne réponse est affichée.\n\n## 🚪 Les 3 garages\n\n> Trois portes de garage fermées. Laquelle ouvrir ?\n\n- Derrière les trois portes, dans un ordre aléatoire :\n  - **un garage vide** 💨 ;\n  - **une carte standard** : Commune (70 %) ou Peu commune (30 %) ;\n  - **une carte haut de gamme** : Épique (80 %) ou Légendaire (20 %).\n- Le joueur touche une porte : elle se lève, puis **les deux autres s'ouvrent** pour montrer ce qu'il a manqué (ou évité).\n- Chances par partie : 1 sur 3 de ne rien gagner, 1 sur 3 d'une carte standard, 1 sur 3 d'une Épique ou d'une Légendaire. C'est très généreux, d'où la limite de **2 parties par jour**.\n- Succès associé : « Bonne porte » (trouver le gros lot).\n\n## ⚔️ Duel de stats\n\n> « Laquelle est la plus rapide ? »\n\n- Deux voitures face à face et une question, à trancher d'un toucher.\n- Questions possibles, selon les données disponibles :\n\n  | Question | Critère |\n  | --- | --- |\n  | Laquelle est la plus rapide ? | Vitesse maximale |\n  | Laquelle est la plus puissante ? | Puissance |\n  | Laquelle est la plus lourde ? | Masse |\n  | Laquelle est la plus longue ? | Longueur |\n  | Laquelle est sortie en premier ? | Année de lancement |\n  | Laquelle est la plus célèbre ? | Nombre de Wikipédias qui lui consacrent un article |\n\n- Les deux voitures ont toujours un **écart suffisant** pour que la question soit équitable : au moins 6 % pour la vitesse, 8 % pour la masse, 3 ans pour l'année, etc. Il n'y a jamais d'égalité.\n- Après la réponse, les deux valeurs sont révélées (« 408,5 km/h » contre « 305 km/h »).\n- **10 manches maximum, la partie s'arrête à la première erreur.**\n- **10 crédits** par bonne réponse, donc 100 crédits pour un 10/10, plus la carte bonus.\n\n## 🧠 Quiz auto\n\n> « De quel pays vient la Nissan Leaf ? »\n\n- **5 questions à 4 choix.** La partie va jusqu'au bout, même en cas d'erreur.\n- Types de questions :\n\n  | Type | Exemple | Pièges |\n  | --- | --- | --- |\n  | Marque | « Quelle marque produit la \"Countach\" ? » | 3 autres marques du catalogue. Si le nom contient la marque, la question se pose sur la photo. |\n  | Pays | « De quel pays vient la \"Tata Nano\" ? » | 3 autres pays du catalogue |\n  | Décennie | « En quelle décennie la \"Citroën DS\" est-elle sortie ? » | Décennies voisines, présentées dans l'ordre chronologique |\n  | Photo | « Quel est ce modèle ? » (photo seule) | 3 autres modèles, **de préférence de la même marque** |\n\n- La question photo n'utilise que des photos stockées sur notre serveur : leur nom de fichier ne contient pas le nom du modèle, donc il ne trahit pas la réponse.\n- **15 crédits** par bonne réponse, donc 75 crédits pour un 5/5, plus la carte bonus.\n\n## Gains par jour\n\n| Jeu | Maximum | En moyenne (estimation) |\n| --- | --- | --- |\n| Duel de stats (3 parties) | 300 🪙 + 3 cartes bonus | 60 à 120 🪙 |\n| Quiz auto (3 parties) | 225 🪙 + 3 cartes bonus | 90 à 150 🪙 |\n| Poids lourds (5 parties) | 5 cartes | 3 à 4 cartes |\n| Question pour une carte (5 parties) | 5 cartes | 2 à 4 cartes |\n| Les 3 garages (2 parties) | 2 cartes | 1,3 carte, dont 0,7 Épique ou Légendaire |\n\nLes mini-jeux rapportent donc environ **7 à 10 cartes par jour** en plus des boosters (jusqu'à 48 boosters, soit 240 cartes par jour au maximum théorique, plutôt 75 à 125 en pratique). Ils complètent les boosters sans les remplacer.\n"},{"id":"fonctionnel/07-credits-et-economie","path":"fonctionnel/07-credits-et-economie.md","section":"Fonctionnel","title":"7. Crédits et économie","markdown":"# 7. Crédits et économie\n\nLes **crédits (🪙)** sont la monnaie du jeu. Le solde est affiché en permanence dans l'en-tête, et l'historique des derniers mouvements se trouve sur le profil.\n\n```mermaid\nflowchart LR\n  subgraph Sources[\"Créés par le jeu\"]\n    B[\"Bonus de bienvenue\"]\n    G[\"Duel, Quiz\"]\n    D[\"Récompense du jour\"]\n    S[\"Succès\"]\n  end\n  subgraph Entre[\"Échangés entre joueurs\"]\n    TV[\"Vente à la bourse\"]\n    EV[\"Vente aux enchères\"]\n  end\n  subgraph Puits[\"Retirés du jeu\"]\n    BO[\"Boutique\"]\n    CO[\"Commission des enchères (5 %)\"]\n  end\n  B & G & D & S --> W((\"🪙 Portefeuille\"))\n  W --> BO\n  W \u003c--> TV\n  W \u003c--> EV\n  EV --> CO\n```\n\nChaque mouvement passe par le **portefeuille** du serveur : il refuse tout solde négatif et inscrit chaque opération au journal, avec le solde obtenu.\n\n## D'où viennent les crédits (sources)\n\n| Source | Montant | Limite |\n| --- | --- | --- |\n| Bonus de bienvenue | 100 | une fois, à l'inscription (`STARTING_CREDITS`) |\n| Duel de stats | 10 par bonne réponse | 3 parties par jour |\n| Quiz auto | 15 par bonne réponse | 3 parties par jour |\n| Vente à la bourse | prix fixé par le vendeur | payé par un autre joueur |\n| Vente aux enchères | meilleure offre − 5 % de commission | payée par un autre joueur |\n| Récompense quotidienne | 50 à 200 (jours 1, 3, 5 et 7 du cycle) | une fois par jour |\n| Succès | 50 / 150 / 400 / 1 000 selon le palier | une fois par succès (11 400 au total) |\n\n## Où partent les crédits (dépenses)\n\n| Dépense | Montant |\n| --- | --- |\n| Boutique | de 40 à 4 000 selon la rareté (voir [Boutique](08-boutique.md)) |\n| Achat à la bourse | prix fixé par le vendeur |\n| Enchère remportée | montant de la meilleure offre (bloqué dès l'offre, rendu si surenchéri) |\n| Commission des enchères | 5 % du prix de vente, **détruits** |\n\n## Principes d'équilibre\n\n- **Pas de transfert déguisé entre comptes** : la bourse et les enchères ne sont ouvertes qu'aux comptes de plus de 24 heures ayant ouvert au moins 3 boosters. Les prix ne peuvent pas descendre sous un plancher par rareté, et les échanges carte contre carte se font entre raretés proches. Voir [Bourse](09-bourse-echanges.md#garde-fous).\n\n- **Création monétaire limitée** : les seules sources de crédits « neufs » sont le bonus de bienvenue et les deux jeux à crédits, plafonnés par le nombre de parties par jour (525 crédits par jour au maximum). Les jeux rapides donnent des **cartes**, pas de crédits : ils n'alimentent pas l'inflation. Les échanges de la bourse ne font que **déplacer** des crédits entre joueurs, sans en créer.\n- **Les puits** : la boutique (les crédits dépensés disparaissent) et la commission de 5 % des enchères. L'inflation reste ainsi contenue malgré les récompenses.\n- **Les récompenses suivent l'assiduité** (série de jours) et la progression (succès), pas le temps passé : elles donnent de quoi enchérir sans encourager à jouer des heures.\n- **Les bots** apportent de la liquidité au lancement : ils achètent les cartes des joueurs avec leurs propres crédits. Voir [Bots](13-bots.md).\n- **Les prix suivent la rareté** : une Commune coûte 40 crédits (une partie de duel moyenne), une Légendaire 4 000 crédits (environ deux semaines de jeu assidu). La boutique permet de **cibler** une rareté sans court-circuiter les boosters.\n- **La boutique donne des repères de prix à la bourse** : quand un joueur crée une offre contre des crédits, le prix proposé par défaut est d'environ 75 % du prix boutique de la rareté (30, 90, 300, 900, 3 000). C'est cohérent : la bourse permet de choisir sa carte précise, la boutique non.\n\n## Journal des mouvements\n\nChaque mouvement est enregistré : date, montant, motif (« Duel de stats », « Achat en boutique », « Vente à la bourse »…), objet concerné et solde après opération. Le joueur voit ses 8 derniers mouvements sur son profil. Ce journal sert aussi d'outil d'audit en cas de litige ou de suspicion de triche.\n\n## Leviers de réglage\n\nTous ces paramètres se règlent sans toucher au code : `STARTING_CREDITS`, `GAMES_PER_DAY`, gains par bonne réponse (`economyConfig` dans `apps/api/src/config.ts`), prix de la boutique (`SHOP_RULES` dans `apps/api/src/modules/marketplace/domain/shop-rotation.ts`).\n"},{"id":"fonctionnel/08-boutique","path":"fonctionnel/08-boutique.md","section":"Fonctionnel","title":"8. Boutique","markdown":"# 8. Boutique\n\nLa boutique est tenue par l'application : elle **vend des cartes contre des crédits**. Son contenu change **toutes les heures**.\n\n## Programme quotidien et rotation horaire\n\nChaque jour (à minuit, heure de Paris), l'application établit **pour chaque rareté un ordre de passage secret** de toutes les cartes de cette rareté. Les rotations successives de la journée dévoilent cet ordre tranche par tranche :\n\n| Rareté | Cartes en vente simultanément | Rotation | Cartes différentes par jour | Prix |\n| --- | --- | --- | --- | --- |\n| Commune | 3 | toutes les heures | 72 | 40 🪙 |\n| Peu commune | 2 | toutes les heures | 48 | 120 🪙 |\n| Rare | 2 | toutes les heures | 48 | 400 🪙 |\n| Épique | 1 | toutes les 2 heures | 12 | 1 200 🪙 |\n| Légendaire | 1 | toutes les 4 heures | 6 | 4 000 🪙 |\n\n- Une carte n'apparaît **qu'une fois par jour**, sauf si la rareté compte moins de cartes que de places dans la journée.\n- Le programme est **imprévisible** : il dépend d'une graine secrète, donc impossible de connaître à l'avance les cartes de demain.\n- Il est **le même pour tous les joueurs** à un instant donné, ce qui permet d'en parler entre joueurs (« la Countach est en boutique jusqu'à 16 h ! »).\n\n## Affaire de l'heure\n\nÀ chaque heure, **une offre** (tirée au hasard parmi celles affichées) est remisée de **25 %**. Elle est mise en avant par un bandeau « Affaire de l'heure −25 % ».\n\n## Règles d'achat\n\n- **Un exemplaire par offre et par joueur.** L'offre affiche ensuite « Acheté ✓ ». Le même joueur peut racheter la carte si elle revient un autre jour.\n- Il faut avoir assez de crédits : le bouton est grisé sinon.\n- Si la boutique tourne pendant que le joueur hésite, l'achat est refusé avec le message « la boutique a tourné » et la page se met à jour.\n- La carte achetée rejoint immédiatement la collection, comme une carte de booster (nouvelle carte ou exemplaire supplémentaire).\n\n## Interface\n\n- Compte à rebours jusqu'à la prochaine rotation et solde de crédits.\n- Offres regroupées par rareté, de la Légendaire à la Commune.\n- Pour les Épiques et les Légendaires : l'heure de fin de l'offre (« Jusqu'à 16:00 »).\n- Toucher une carte ouvre sa fiche détaillée avant achat.\n"},{"id":"fonctionnel/09-bourse-echanges","path":"fonctionnel/09-bourse-echanges.md","section":"Fonctionnel","title":"9. Bourse d'échanges","markdown":"# 9. Bourse d'échanges\n\nLa bourse est une **place de marché ouverte à tous les joueurs**. On y propose une de ses cartes, généralement un doublon, en échange :\n\n- **d'une carte précise** (« ma Mustang contre ta 2CV »), ou\n- **d'un montant de crédits** fixé par le vendeur.\n\nPas besoin d'être amis : toute offre ouverte est visible et acceptable par n'importe quel joueur. Au lancement, des [bots](13-bots.md) 🤖 publient et acceptent aussi des offres. Pour une carte très demandée, préférez les [enchères](11-encheres.md).\n\n## Proposer une carte\n\n1. « + Proposer une carte » (ou « 🤝 Proposer à l'échange » depuis la fiche d'une carte).\n2. Choisir la carte proposée parmi sa collection. Un avertissement s'affiche si c'est le **dernier exemplaire**.\n3. Choisir la contrepartie :\n   - **🪙 Crédits** : un prix est suggéré selon la rareté et reste modifiable ;\n   - **🎴 Une carte** : choisie dans tout le catalogue, avec une recherche.\n4. « Publier l'offre ».\n\n**Séquestre** : la carte proposée **quitte la collection** tant que l'offre est ouverte. On ne peut donc pas la proposer deux fois ni la vendre en double. Elle revient si l'offre est retirée ou expire.\n\nLimites : **10 offres ouvertes** par joueur au maximum (`MAX_OPEN_TRADES`), et **7 jours** de validité par offre (`TRADE_DAYS`).\n\n## Parcourir les offres\n\nTrois onglets :\n\n| Onglet | Contenu |\n| --- | --- |\n| Toutes | Toutes les offres des autres joueurs, les plus récentes d'abord |\n| Pour moi | Les offres **intéressantes et accessibles** : la carte proposée me manque, **et** je possède la carte demandée ou j'ai assez de crédits |\n| Mes offres | Mes offres ouvertes (« 3/10 offres ouvertes »), avec un bouton « Retirer » |\n\nFiltres : recherche par nom ou marque de la carte proposée, et rareté.\n\nChaque offre affiche la carte proposée, la contrepartie (carte ou prix), le pseudo du vendeur et le délai avant expiration. Des repères aident à décider : « Vous ne l'avez pas » sur la carte proposée, « Vous l'avez ×2 » sur la carte demandée.\n\n## Accepter une offre\n\n- Le bouton « Accepter » n'est actif que si l'on peut honorer l'offre. Sinon, il indique « Carte requise » ou « Crédits insuffisants ».\n- L'échange est **immédiat et atomique** : les deux cartes (ou la carte et les crédits) changent de main en une seule opération. Il ne peut pas y avoir d'échange à moitié fait.\n- Si deux joueurs acceptent la même offre au même instant, **un seul** l'obtient. L'autre reçoit « Cette offre n'est plus disponible ».\n- Le vendeur reçoit une **notification** (« Échange conclu 🤝 ») s'il les a activées.\n- Les succès d'échange sont vérifiés pour **les deux** joueurs.\n\n## Retrait et expiration\n\n- Le vendeur peut **retirer** son offre à tout moment, et la carte revient dans sa collection.\n- Au bout de 7 jours, l'offre **expire** : elle disparaît de la bourse et la carte est rendue automatiquement (vérification toutes les 10 minutes et au démarrage du serveur).\n\n## Vie d'une offre\n\n```mermaid\nstateDiagram-v2\n  [*] --> Ouverte: mise en bourse\u003cbr/>(carte mise de côté)\n  Ouverte --> Conclue: un autre joueur accepte\u003cbr/>(paie ou donne la carte demandée)\n  Ouverte --> Retirée: le vendeur retire son offre\u003cbr/>(carte rendue)\n  Ouverte --> Retirée: 7 jours écoulés\u003cbr/>(carte rendue)\n  Conclue --> [*]\n  Retirée --> [*]\n```\n\n## Garde-fous\n\n- **Accès au marché** : un compte doit avoir au moins **24 heures** et avoir ouvert au moins **3 boosters** pour vendre, acheter ou enchérir. Les bots en sont dispensés. Cela empêche de créer des comptes jetables pour transférer leurs cartes et crédits de bienvenue vers un compte principal.\n- **Prix plancher** selon la rareté : 5 (Commune), 15 (Peu commune), 50 (Rare), 150 (Épique), 500 (Légendaire) crédits. Impossible donc de « donner » une Légendaire pour 1 crédit.\n- **Échange carte contre carte** : les deux cartes doivent être de raretés proches (au plus un cran d'écart, par exemple Rare contre Épique).\n- On ne peut pas accepter sa propre offre.\n- On ne peut pas échanger une carte contre elle-même.\n- Une carte demandée doit exister dans le catalogue actif.\n- Prix entre 1 et 1 000 000 crédits.\n"},{"id":"fonctionnel/10-application-mobile","path":"fonctionnel/10-application-mobile.md","section":"Fonctionnel","title":"10. Application mobile","markdown":"# 10. Application mobile\n\nLe téléphone est la cible principale. Garage est une **PWA** (Progressive Web App) : un site web qui s'installe et se comporte comme une application, sans passer par les stores.\n\n## Installation\n\n| Appareil | Comment |\n| --- | --- |\n| Android (Chrome, Edge…) | Bouton « Installer » sur la page Boosters ou dans Profil > Application |\n| iPhone / iPad (Safari) | Partager ⎋ puis « Sur l'écran d'accueil » (une aide s'affiche dans l'application) |\n| Ordinateur (Chrome, Edge) | Icône d'installation dans la barre d'adresse, ou le bouton « Installer » |\n\nUne fois installé, Garage s'ouvre en plein écran avec sa propre icône (la porte de garage), directement sur la page Boosters. Des raccourcis (appui long sur l'icône) mènent à « Ouvrir un booster » et « Ma collection ».\n\n## Notifications\n\nÀ activer dans **Profil > Application > Notifications** :\n\n- **« Ta réserve est pleine 🎁 »** : envoyée une seule fois quand la réserve atteint 10 boosters. Aucune notification à chaque booster, pour ne pas déranger.\n- **« Échange conclu 🤝 »** : quand une offre de bourse est acceptée.\n- Un bouton « Tester » envoie une notification d'essai.\n\nSur iPhone, les notifications ne fonctionnent qu'une fois l'application **installée sur l'écran d'accueil** (iOS 16.4 ou plus récent). Elles exigent aussi que le site soit servi en HTTPS.\n\n## Ergonomie mobile\n\n- **Barre d'onglets en bas** (Boosters, Collection, Jeux, Marché, Profil), avec un badge qui affiche le nombre de boosters disponibles. Elle tient compte de l'encoche et de la barre de geste.\n- **Révélation des cartes une par une** : on touche pour retourner, on glisse pour passer à la suivante, et le téléphone vibre sur les cartes rares (Android ; iOS ne permet pas la vibration web).\n- Les notifications de succès apparaissent en haut de l'écran, en format compact.\n- Filtres repliables, jauges qui défilent horizontalement, boutons larges pensés pour le pouce.\n\n## Hors-ligne\n\nL'interface et les photos de cartes déjà vues sont gardées en cache (jusqu'à 600 photos). Sans réseau, l'application s'ouvre et affiche les écrans visités, mais les actions de jeu (ouvrir un booster, jouer, acheter) demandent une connexion : l'état du jeu est toujours celui du serveur.\n"},{"id":"fonctionnel/11-encheres","path":"fonctionnel/11-encheres.md","section":"Fonctionnel","title":"11. Enchères","markdown":"# 11. Enchères\n\nLes enchères complètent la [bourse d'échanges](09-bourse-echanges.md). À la bourse, le vendeur fixe un prix et le premier qui accepte l'emporte. Aux enchères, le vendeur fixe une **mise à prix** et une **durée**, et la carte part au **meilleur enchérisseur** à la fin. C'est idéal pour les cartes recherchées, dont la valeur est difficile à estimer.\n\nElles se trouvent dans **Marché > 🔨 Enchères**, avec trois vues : « En cours », « Mes offres » et « Mes ventes ».\n\n## Mettre une carte aux enchères\n\n1. « + Mettre aux enchères », ou « 🔨 Mettre aux enchères » depuis la fiche d'une carte.\n2. Choisir la carte. Un avertissement s'affiche s'il s'agit du dernier exemplaire.\n3. Fixer la **mise à prix**. La valeur suggérée est la moitié du prix boutique de la rareté : 20, 60, 200, 600 ou 2 000 crédits.\n4. Choisir la **durée** : 1, 3, 6, 12 ou 24 heures.\n\nLa carte est **mise sous séquestre** pendant toute la durée de l'enchère : elle quitte la collection et ne peut être ni vendue ailleurs ni échangée. On peut avoir **5 enchères en cours** au maximum (`MAX_OPEN_AUCTIONS`).\n\nUne enchère peut être **annulée tant que personne n'a enchéri**. La carte revient alors dans la collection.\n\n## Enchérir\n\n- L'offre minimale est la **mise à prix**, puis la meilleure offre **+5 %** (au moins 1 crédit). Le champ de saisie est prérempli avec ce minimum.\n- Les crédits de l'offre sont **prélevés immédiatement** (« bloqués »). Le solde affiché le reflète : impossible de promettre des crédits qu'on n'a pas.\n- Dès que quelqu'un **surenchérit**, l'ancien meilleur enchérisseur est **remboursé intégralement**, au même instant, et reçoit une notification (« Vous avez été surenchéri ⚠️ »).\n- On ne peut pas surenchérir sur sa propre offre, ni enchérir sur sa propre vente.\n- **Anti « dernière seconde »** : une offre arrivant dans les **2 dernières minutes** repousse la fin de l'enchère à 2 minutes. Tout le monde a donc le temps de répondre.\n\n## Fin de l'enchère\n\nLa clôture est automatique (vérification toutes les 30 secondes) :\n\n| Situation | Résultat |\n| --- | --- |\n| Au moins une offre | La carte part au meilleur enchérisseur. Le vendeur reçoit le montant **moins 5 % de commission** (`AUCTION_FEE_PERCENT`). Les deux reçoivent une notification. |\n| Aucune offre | La carte revient au vendeur |\n\nLa commission de 5 % est un **puits de crédits** : elle sort de l'économie et limite l'inflation, comme les achats en boutique.\n\n## Vie d'une enchère\n\n```mermaid\nstateDiagram-v2\n  [*] --> EnCours: mise aux enchères\u003cbr/>(carte mise de côté)\n  EnCours --> EnCours: nouvelle offre\u003cbr/>(crédits bloqués, précédent remboursé,\u003cbr/>prolongée si \u003c 2 min)\n  EnCours --> Annulée: annulation sans aucune offre\u003cbr/>(carte rendue)\n  EnCours --> Vendue: échéance avec au moins une offre\u003cbr/>(carte à l'acheteur, prix − 5 % au vendeur)\n  EnCours --> Invendue: échéance sans offre\u003cbr/>(carte rendue)\n  Annulée --> [*]\n  Vendue --> [*]\n  Invendue --> [*]\n```\n\n```mermaid\nsequenceDiagram\n  actor A as Alice\n  actor B as Bruno\n  participant S as Serveur\n  A->>S: offre 60 🪙\n  S->>S: 60 ≥ minimum ? solde suffisant ?\n  S-->>A: meilleure offre (60 🪙 bloqués)\n  B->>S: offre 63 🪙 (minimum = 60 + 5 %)\n  S->>S: bloque 63 🪙 chez Bruno\n  S->>A: rembourse 60 🪙 + notification « surenchérie »\n  S-->>B: meilleure offre\n  Note over S: à l'échéance : carte à Bruno,\u003cbr/>63 − 3 = 60 🪙 au vendeur\n```\n\n## Garde-fous\n\n- Mêmes règles d'accès que la bourse : compte de plus de **24 heures** ayant ouvert au moins **3 boosters**, pour vendre comme pour enchérir.\n- **Mise à prix minimale** selon la rareté (5, 15, 50, 150, 500 crédits).\n- Montants entiers, entre la mise à prix ou l'offre minimale et 10 000 000 ; jamais au-delà de son solde.\n\n## Affichage\n\nChaque enchère montre la carte (avec « Vous ne l'avez pas » si elle manque à la collection), le **compte à rebours** (en rouge dans les 5 dernières minutes), le prix actuel et le nombre d'offres, le meilleur enchérisseur et le vendeur. Les **bots** sont signalés par 🤖. La liste se met à jour toutes les 15 secondes pour voir arriver les nouvelles offres.\n\n## Succès liés\n\n« Adjugé ! » (remporter une enchère), « Collectionneur averti » (en remporter 10), « Commissaire-priseur » (vendre 5 cartes aux enchères).\n"},{"id":"fonctionnel/12-recompenses","path":"fonctionnel/12-recompenses.md","section":"Fonctionnel","title":"12. Récompenses régulières","markdown":"# 12. Récompenses régulières\n\nPour enchérir et acheter, il faut des crédits. En plus des mini-jeux, trois mécanismes en distribuent régulièrement, et récompensent l'assiduité plutôt que le temps passé.\n\n## Récompense quotidienne (jours consécutifs)\n\nUn calendrier de 7 jours s'affiche en haut de la page **Boosters**. Une fois par jour, le joueur touche « Récupérer » :\n\n| Jour | Récompense |\n| --- | --- |\n| J1 | 50 crédits |\n| J2 | 1 booster |\n| J3 | 100 crédits |\n| J4 | 2 boosters |\n| J5 | 150 crédits |\n| J6 | 3 boosters |\n| J7 | 200 crédits + **1 carte Épique** (Légendaire une fois sur cinq) |\n\n- Les jours s'enchaînent tant que le joueur revient **chaque jour** (minuit, heure de Paris). **Un jour manqué fait repartir la série au jour 1.**\n- Après le 7ᵉ jour, le cycle recommence au jour 1, mais la **série continue de compter** (8, 9, 10… jours) pour les succès.\n- Les boosters offerts s'ajoutent à la réserve, **même au-delà de 10**. Ils ne sont pas perdus si la réserve est pleine.\n- Une semaine complète rapporte 500 crédits, 6 boosters et 1 carte Épique ou mieux.\n\nSuccès liés : « Bonne habitude » (3 jours d'affilée), « Habitué du garage » (7 jours), « Fidèle au poste » (30 jours).\n\n```mermaid\nflowchart LR\n  J1[\"J1\u003cbr/>50 🪙\"] --> J2[\"J2\u003cbr/>1 booster\"] --> J3[\"J3\u003cbr/>100 🪙\"] --> J4[\"J4\u003cbr/>2 boosters\"] --> J5[\"J5\u003cbr/>150 🪙\"] --> J6[\"J6\u003cbr/>3 boosters\"] --> J7[\"J7\u003cbr/>200 🪙 + carte Épique\"]\n  J7 -- \"lendemain\" --> J1\n  X[\"Jour manqué\"] -. \"la série repart\" .-> J1\n```\n\n## Récompenses des succès\n\nChaque succès débloqué **verse automatiquement des crédits** selon son palier : 50 (bronze), 150 (argent), 400 (or), 1 000 (platine). Les 45 succès rapportent 11 400 crédits au total, étalés sur toute la vie du joueur : les premiers arrivent dès les premières minutes, les derniers après des mois. Voir [Succès et badges](05-succes-et-badges.md).\n\n## Mini-jeux\n\nLes jeux à crédits (Duel de stats, Quiz auto) rapportent des crédits à chaque bonne réponse, et les jeux rapides des cartes. Voir [Mini-jeux](06-mini-jeux.md).\n\n## Ordre de grandeur pour un joueur régulier\n\n| Source | Par jour | Par semaine |\n| --- | --- | --- |\n| Récompense quotidienne | ~70 🪙 en moyenne (+ boosters, carte Épique le 7ᵉ jour) | 500 🪙 |\n| Mini-jeux à crédits | 150 à 270 🪙 | 1 000 à 1 900 🪙 |\n| Succès | très variable : beaucoup au début, puis de temps en temps | — |\n\nAssez pour une carte Rare de la boutique (400) tous les deux jours, ou pour une enchère disputée sur une Épique en fin de semaine.\n"},{"id":"fonctionnel/13-bots","path":"fonctionnel/13-bots.md","section":"Fonctionnel","title":"13. Bots : faire vivre le marché au lancement","markdown":"# 13. Bots : faire vivre le marché au lancement\n\nAu lancement de l'application, il y a peu de joueurs : la bourse et les enchères resteraient vides, et une carte mise en vente ne trouverait pas preneur. Pour amorcer le marché, l'application fait tourner des **joueurs automatiques (bots)**. Ils jouent avec **les mêmes règles** que les joueurs humains.\n\n## Ce que fait un bot\n\nUn bot « passe » de temps en temps : toutes les 10 à 45 minutes selon son tempérament, de façon irrégulière, et **4 fois moins souvent la nuit** (1 h à 7 h). À chaque passage :\n\n1. **Récompense du jour** : il la réclame une fois par jour, et touche en plus un revenu simulant ses parties de mini-jeux (80 à 320 crédits par jour).\n2. **Boosters** : il ouvre 1 à 3 boosters de sa réserve (s’il en a), qui se régénère comme pour tout le monde. Sa collection grandit donc naturellement, et il débloque des succès (avec leurs récompenses).\n3. **Enchères** : il regarde les enchères qui finissent le plus tôt et, **parfois**, enchérit. Au plus 2 offres par passage, avec au plus 60 % de son solde.\n4. **Bourse** : il regarde les offres récentes, **en priorité celles des joueurs**, et accepte au plus un échange par passage, s'il le trouve avantageux.\n5. **Ventes** : de temps en temps, il met un **doublon** en vente, le plus souvent aux enchères (mise à prix basse, 1 à 12 h), sinon à la bourse. Au plus 2 ventes en cours de chaque type.\n\n## Comment un bot décide\n\nChaque bot a une **personnalité**, tirée à sa création :\n\n| Personnalité | Tempérament |\n| --- | --- |\n| Collectionneur | Valorise fortement les cartes qui lui manquent ; vend peu |\n| Marchand | Enchérit souvent mais paie peu ; revend beaucoup, un peu cher |\n| Économe | Enchérit rarement et petit |\n| Passionné | Fan d'une marque : il paie jusqu'à 1,8 fois plus pour elle |\n\nBeaucoup ont aussi une **marque fétiche** et certains un faible pour les **voitures de course**.\n\n**Valeur estimée d'une carte** = valeur de référence de la rareté (le prix boutique : 40, 120, 400, 1 200, 4 000), ajustée selon :\n\n- s'il l'a déjà : ×1,0 à ×1,45 si elle lui manque, ×0,7 s'il en a un exemplaire, ×0,4 s'il en a plusieurs ;\n- sa marque fétiche, son goût pour la course ;\n- sa générosité (de ×0,6 à ×1,15) ;\n- son humeur du moment (±15 %).\n\n**Enchérir, mais pas toujours** : si l'offre minimale dépasse sa valeur estimée, il passe. Sinon, il enchérit avec une **probabilité** qui dépend de son tempérament (de 35 à 70 %). Elle augmente si l'enchère se termine dans moins de 15 minutes ou si l'affaire est bonne, et elle diminue fortement quand le vendeur est un autre bot. Son offre ne dépasse **jamais** sa valeur estimée. Un joueur peut donc toujours le battre en mettant le prix.\n\n**Échanges** : il achète une carte à la bourse si le prix est inférieur à 90 % de sa valeur estimée. Il accepte un échange carte contre carte seulement s'il **garde au moins un exemplaire** de la carte demandée et si ce qu'il reçoit vaut au moins 90 % de ce qu'il donne.\n\n## Transparence\n\nLes bots sont **signalés par 🤖** à côté de leur pseudo, partout où un pseudo apparaît (enchères, bourse). Un message au survol explique leur rôle. C'est un choix délibéré : ils servent à amorcer l'activité, pas à faire croire à une communauté qui n'existe pas. Le cacher serait trompeur pour les premiers joueurs et risqué pour la réputation de l'application.\n\nLes bots n'ont **pas de compte de connexion** : personne ne peut se connecter à leur place.\n\n## Mêmes règles que les joueurs\n\nLes bots passent par les mêmes actions que les joueurs, avec les mêmes contrôles : solde, séquestre, offre minimale, prix plancher, commission. Ils ne sont dispensés que de l'ancienneté de compte exigée pour accéder au marché, puisqu'ils sont pilotés par le serveur et ne peuvent pas servir à transférer des biens.\n\n## Réglages\n\n| Variable | Défaut | Effet |\n| --- | --- | --- |\n| `BOTS_ENABLED` | `true` | `false` pour arrêter les bots (ils restent en base, inactifs) |\n| `BOTS_COUNT` | 12 | Nombre de bots (16 au maximum) |\n| `BOTS_START_CREDITS` | 1 500 | Crédits de départ de chaque bot |\n| `BOTS_TICK_SECONDS` | 60 | Fréquence de la boucle (chaque bot n'agit qu'à son heure) |\n\nQuand la communauté aura grandi, on pourra réduire leur nombre, puis les arrêter avec `BOTS_ENABLED=false`.\n"},{"id":"technique/01-architecture","path":"technique/01-architecture.md","section":"Technique","title":"1. Architecture et choix techniques","markdown":"# 1. Architecture et choix techniques\n\n## Vue d'ensemble\n\n```mermaid\nflowchart LR\n  U[\"📱 Navigateur / PWA\u003cbr/>Nuxt 4 SPA + service worker\"] -- \"HTTPS, même origine\" --> W[\"web : Nuxt / Nitro\u003cbr/>sert l'app + proxy /api\"]\n  W -- \"/api/** (proxy)\" --> A[\"api : NestJS 11\u003cbr/>Better Auth · Prisma 6\u003cbr/>tâches de fond\"]\n  A --> DB[(\"PostgreSQL 17\")]\n  A --> M[(\"volume « media »\u003cbr/>photos WebP\")]\n  A -. \"import\" .-> WD[\"Wikidata · Commons · Wikipédia\"]\n  A -. \"notifications\" .-> WP[\"Services Web Push\u003cbr/>(Google, Mozilla, Apple…)\"]\n```\n\nTrois conteneurs Docker : `db` (PostgreSQL), `api` (NestJS) et `web` (Nuxt). Seul `web` est exposé.\n\n## Organisation du dépôt\n\n```\napps/\n  api/                       NestJS\n    prisma/                  schéma + migrations\n    src/\n      shared/                noyau partagé : erreurs métier, Credits, événements, transactions (CLS),\n                             verrous joueur, horloge, aléatoire, filtre d'erreurs, limitation de débit\n      modules/               un module NestJS par contexte métier (DDD + hexagonal) :\n        identity/            Better Auth, garde global, décorateurs\n        player/              création de la fiche joueur, profil /me\n        wallet/              solde et journal des crédits\n        catalog/             cartes, raretés, import Wikidata, photos, résumés\n        collection/          cartes possédées, boosters, tirage, garanties\n        statistics/          statistiques d'un joueur (lecture)\n        progression/         succès et récompenses, récompense quotidienne\n        games/               mini-jeux\n        marketplace/         boutique, bourse d'échanges, enchères\n        notifications/       Web Push\n        bots/                joueurs automatiques\n          (chaque module : domain/ · application/ · infrastructure/ · http/)\n      cli/                   commande d'import\n    test/e2e/                tests de bout en bout (vraie API, base temporaire)\n  web/                       Nuxt 4\n    app/pages/               écrans\n    app/components/          cartes, boosters, marché…\n    app/composables/         API, session, joueur, PWA, notifications\n    server/routes/api/       proxy vers l'API\n    public/                  manifeste, service worker, icônes\ndocs/                        cette documentation\ndocker-compose.yml\n```\n\n## Choix techniques et justifications\n\n| Choix | Pourquoi | Alternatives écartées |\n| --- | --- | --- |\n| **NestJS 11** | Demandé ; structure modulaire claire, injection de dépendances, validation intégrée | NestJS 12, plus récent mais encore moins éprouvé au moment du développement |\n| **Prisma 6** | Schéma lisible, migrations versionnées, types générés, adaptateur officiel Better Auth | Prisma 7/8 (nouveau générateur, adaptateurs obligatoires), Drizzle |\n| **PostgreSQL** | Demandé ; transactions et verrous de ligne (`FOR UPDATE`) indispensables pour l'économie | — |\n| **Better Auth** | Bibliothèque prête à l'emploi : sessions en base, hachage des mots de passe, limitation de débit, plugins OAuth et 2FA pour plus tard | Passport + JWT maison (plus de code sensible à écrire), service externe (dépendance et coût) |\n| **Nuxt 4, mode SPA** | Demandé (Vue + Nuxt) ; jeu derrière une connexion, donc le référencement n'est pas un enjeu, et le rendu serveur n'apporterait que de la complexité | Rendu serveur (SSR), qui obligerait à transmettre la session côté serveur |\n| **Proxy `/api` dans Nitro** | Une seule origine : cookies first-party, pas de CORS, pas de problème de cookies tiers sur Safari | API exposée sur un autre domaine |\n| **PWA plutôt qu'appli native** | Une seule base de code, installation sans store, notifications push ; enveloppable plus tard avec Capacitor | React Native ou Flutter (deuxième base de code) |\n| **CSS fait main** | Les cartes demandent un CSS spécifique (holographie, `container queries`, 3D) ; pas de framework à apprendre | Tailwind |\n| **DDD et architecture hexagonale** (`src/modules/*/domain`) | Règles du jeu dans des agrégats et fonctions pures, testables sans base ; un module par contexte métier ; dépendances vers l'intérieur uniquement. Détail : [Architecture DDD](13-architecture.md) | Services « fourre-tout » qui mélangent HTTP, règles et SQL |\n| **Tâches de fond par `setInterval`** dans l'API | Suffisant pour une instance unique ; aucune infrastructure en plus | File de tâches (BullMQ et Redis) : à prévoir pour plusieurs instances, voir [Évolutions](11-evolutions.md) |\n| **Photos stockées localement en WebP** | Indépendance vis-à-vis de Wikimedia, performances, hors-ligne, respect de leur politique robots | Liens directs vers Wikimedia (fragile, et soumis à leurs limites) |\n\n## Flux d'une requête\n\n1. Le navigateur appelle `/api/boosters/open` sur l'origine du site.\n2. Nitro (conteneur `web`) **proxifie** la requête vers `http://api:3001/api/boosters/open`. Il transmet les cookies et ajoute `X-Forwarded-For` (l'IP du joueur, pour la limitation de débit).\n3. Dans NestJS, le **garde global** `AuthGuard` valide la session Better Auth (cookie signé, cache court) et place l'utilisateur dans la requête.\n4. La limitation de débit par joueur s'applique. La fiche joueur est créée si besoin.\n5. Le **contrôleur** (`http/`) valide les entrées. Tout champ non prévu est refusé. Il appelle ensuite le **cas d'usage** (`application/`).\n6. Le cas d'usage ouvre une **unité de travail** (transaction portée par le contexte), **verrouille** le joueur (`SELECT … FOR UPDATE`) et charge les **agrégats** (`domain/`), qui appliquent les règles. Il enregistre ensuite via les repositories (`infrastructure/`) et publie des **événements de domaine**.\n7. Les abonnés aux événements agissent dans la même transaction (succès et leurs récompenses), puis après validation (notifications push). Les succès débloqués sont ajoutés à la réponse (`newAchievements`).\n\n```mermaid\nsequenceDiagram\n  participant N as Navigateur\n  participant P as Proxy Nitro\n  participant O as Contrôle d'origine\n  participant G as Gardes (session, débit)\n  participant I as Intercepteurs\n  participant C as Contrôleur + DTO\n  participant U as Cas d'usage\n  participant D as Domaine\n  participant R as Repositories\n  N->>P: POST /api/... (cookie de session)\n  P->>O: + X-Forwarded-For\n  O->>G: origine = le site ?\n  G->>I: session valide ? débit \u003c limite ?\n  I->>C: fiche joueur créée si besoin\n  C->>U: entrées validées (champs en trop → 400)\n  U->>R: transaction + verrous (FOR UPDATE)\n  R-->>U: agrégats\n  U->>D: règles du jeu\n  D-->>U: décision (ou erreur métier)\n  U->>R: écritures + événements de domaine\n  U-->>C: résultat\n  C-->>N: JSON (+ newAchievements)\n```\n\nVoir l'exemple complet dans [Architecture DDD](13-architecture.md#exemple--ouverture-dun-booster).\n\nLes routes `/api/auth/*` sont traitées directement par le gestionnaire Better Auth, monté avant l'analyse du corps JSON. Les photos `/api/media/*` sont servies en fichiers statiques avec un cache d'un an.\n\n## Fuseau horaire\n\nLes journées de jeu (parties de mini-jeux, programme de la boutique) suivent `GAME_TIMEZONE` (par défaut `Europe/Paris`). Ce calcul se fait sans bibliothèque, avec l'API `Intl`, et gère les changements d'heure (`src/shared/domain/zoned-time.ts`, testé).\n"},{"id":"technique/02-modele-de-donnees","path":"technique/02-modele-de-donnees.md","section":"Technique","title":"2. Modèle de données","markdown":"# 2. Modèle de données\n\nLe schéma complet, commenté, se trouve dans `apps/api/prisma/schema.prisma`. Les migrations sont versionnées dans `apps/api/prisma/migrations/` et appliquées au démarrage du conteneur (`prisma migrate deploy`).\n\n## Schéma\n\n### Vue d'ensemble\n\n```mermaid\nerDiagram\n  user ||--|| player : \"état de jeu\"\n  user ||--o{ session : \"\"\n  user ||--o{ account : \"\"\n  user ||--o{ user_card : \"possède\"\n  car ||--o{ user_card : \"\"\n  user ||--o{ credit_transaction : \"journal\"\n  user ||--o{ booster_opening : \"\"\n  user ||--o{ user_achievement : \"\"\n  user ||--o{ game_session : \"\"\n  user ||--o{ shop_purchase : \"\"\n  user ||--o{ trade_offer : \"vend / achète\"\n  car ||--o{ trade_offer : \"proposée / demandée\"\n  user ||--o{ auction : \"vend / mène\"\n  car ||--o{ auction : \"\"\n  auction ||--o{ bid : \"\"\n  user ||--o{ push_subscription : \"\"\n```\n\n### Joueur, collection et progression\n\n```mermaid\nerDiagram\n  user ||--|| player : \"1-1\"\n  user ||--o{ user_card : \"possède\"\n  car ||--o{ user_card : \"exemplaires\"\n  user ||--o{ booster_opening : \"ouvre\"\n  user ||--o{ user_achievement : \"débloque\"\n  user ||--o{ game_session : \"joue\"\n  user {\n    string id PK\n    string name\n    string email UK\n    datetime createdAt \"ancienneté (accès au marché)\"\n  }\n  player {\n    string userId PK\n    int boosters \"réserve\"\n    datetime boosterAnchor \"régénération\"\n    int boostersOpened\n    int sinceEpic \"garantie\"\n    int sinceLegendary \"garantie\"\n    int credits\n    int dailyStreak\n    string lastDailyClaim\n    bool isBot\n  }\n  car {\n    int id PK\n    string externalId UK \"QID Wikidata\"\n    string name\n    string manufacturer\n    enum rarity\n    enum rarityOverride\n    bool active\n  }\n  user_card {\n    string userId PK\n    int carId PK\n    int quantity \"toujours >= 1\"\n  }\n  booster_opening {\n    uuid id PK\n    string userId FK\n    int_array carIds\n  }\n  user_achievement {\n    string userId PK\n    string achievementId PK \"payé une seule fois\"\n  }\n  game_session {\n    uuid id PK\n    string userId FK\n    enum type\n    enum status\n    json state \"réponses jamais envoyées\"\n    int score\n  }\n```\n\n### Économie et marché\n\n```mermaid\nerDiagram\n  user ||--o{ credit_transaction : \"journal\"\n  user ||--o{ shop_purchase : \"achète\"\n  user ||--o{ trade_offer : \"vend\"\n  car ||--o{ trade_offer : \"proposée / demandée\"\n  user ||--o{ auction : \"vend / mène\"\n  car ||--o{ auction : \"en vente\"\n  auction ||--o{ bid : \"offres\"\n  credit_transaction {\n    uuid id PK\n    string userId FK\n    int amount \"+ gain / - dépense\"\n    string reason\n    string ref\n    int balance \"solde après\"\n  }\n  shop_purchase {\n    uuid id PK\n    string userId FK\n    string offerKey \"unique par joueur\"\n    int carId\n    int price\n  }\n  trade_offer {\n    uuid id PK\n    string sellerId FK\n    int offeredCarId FK \"en séquestre\"\n    int wantedCarId FK \"ou bien price\"\n    int price\n    enum status\n    string buyerId FK\n    datetime expiresAt\n  }\n  auction {\n    uuid id PK\n    string sellerId FK\n    int carId FK \"en séquestre\"\n    int startPrice\n    int currentBid \"crédits bloqués\"\n    string bidderId FK\n    enum status\n    datetime endsAt\n  }\n  bid {\n    uuid id PK\n    uuid auctionId FK\n    string userId FK\n    int amount\n  }\n```\n\nTables par contexte (chaque contexte n'écrit que ses tables, ou ses colonnes de `player`) :\n\n| Contexte | Tables / colonnes |\n| --- | --- |\n| `identity` | `user`, `session`, `account`, `verification` (Better Auth) |\n| `wallet` | `player.credits`, `player.creditsEarned`, `credit_transaction` |\n| `collection` | `user_card`, `booster_opening`, `player.boosters`, `boosterAnchor`, `boostersOpened`, `cardsObtained`, `sinceEpic`, `sinceLegendary` |\n| `progression` | `user_achievement`, `player.dailyStreak`, `bestStreak`, `lastDailyClaim` |\n| `games` | `game_session`, `player.gamesPlayed`, `gameCardsWon`, `doorsJackpots` |\n| `marketplace` | `shop_purchase`, `trade_offer`, `auction`, `bid`, `player.shopPurchases`, `tradesCompleted`, `auctionsWon`, `auctionsSold` |\n| `catalog` | `car` |\n| `notifications` | `push_subscription`, `player.fullNotifiedAnchor` |\n| `bots` | `player.isBot`, `botProfile`, `botNextActionAt` |\n\n## Tables\n\n### Authentification (format imposé par Better Auth)\n\n`user`, `session`, `account` (le mot de passe haché est dans `account.password`), `verification`.\n\n### `car`, le catalogue\n\n| Colonne | Rôle |\n| --- | --- |\n| `externalId` | QID Wikidata (`Q172146`) ou `seed:\u003cslug>` pour le jeu de secours |\n| `name`, `manufacturer`, `country`, `yearStart`, `yearEnd` | Identité |\n| `powerKw`, `topSpeedKmh`, `massKg`, `lengthMm` | Caractéristiques (souvent partielles) |\n| `racing` | Voiture de course |\n| `popularity` | Nombre de Wikipédias ayant un article (sert à calculer la rareté) |\n| `rarity`, `rarityOverride` | Rareté calculée / forcée manuellement (la seconde l'emporte) |\n| `wikiTitle`, `wikiLang`, `summary`, `summaryFetchedAt` | Article et résumé Wikipédia |\n| `imageFile` | Nom du fichier sur Commons |\n| `imagePath` | Copie locale (relative à `MEDIA_DIR`) |\n| `imageUrl` | Image distante, utilisée en repli |\n| `imageAuthor`, `imageLicense`, `imageLicenseUrl` | Crédits de la photo |\n| `imageCheckedAt` | Dernière tentative de téléchargement |\n| `active` | Carte présente dans le jeu |\n\n### `player`, l'état de jeu\n\n| Colonne | Rôle |\n| --- | --- |\n| `boosters`, `boosterAnchor` | Réserve et ancre du minuteur (voir [Moteur de jeu](04-moteur-de-jeu.md)) |\n| `fullNotifiedAnchor` | Évite de notifier deux fois le même remplissage |\n| `sinceEpic`, `sinceLegendary` | Compteurs de garantie |\n| `credits`, `creditsEarned` | Solde et cumul gagné (hors bonus de bienvenue) |\n| `boostersOpened`, `cardsObtained`, `gamesPlayed`, `tradesCompleted`, `shopPurchases`, `gameCardsWon`, `doorsJackpots`, `auctionsWon`, `auctionsSold` | Compteurs pour les statistiques et les succès |\n| `dailyStreak`, `bestStreak`, `lastDailyClaim` | Récompense quotidienne : série en cours, meilleure série, dernier jour réclamé (`AAAA-MM-JJ`, fuseau du jeu) |\n| `isBot`, `botProfile`, `botNextActionAt` | Bots : drapeau, personnalité (JSON), prochain passage |\n\nLa ligne `player` est créée à la première requête du joueur (`upsert`), avec 10 boosters et 100 crédits.\n\n### Collection et historique\n\n- `user_card (userId, carId)` : **une ligne par carte possédée**, avec `quantity ≥ 1`. La ligne est supprimée quand la quantité tombe à 0 : toute ligne présente signifie donc « possédée ».\n- `booster_opening` : identifiants des cartes tirées, avec la date.\n- `user_achievement (userId, achievementId)` : succès débloqués. Les définitions sont dans le code, pas en base.\n\n### Économie\n\n- `credit_transaction` : `amount` (positif ou négatif), `reason` (`game:duel`, `game:quiz`, `shop`, `trade:sale`, `trade:purchase`), `ref` (identifiant de l'objet concerné), `balance` (solde après opération).\n- `game_session` : `type` (DUEL, QUIZ, WEIGHT, MYSTERY, DOORS), `status`, `round`, `score`, `credits`, `rewardCarId`, et `state` (JSON) qui contient la question en cours **avec sa réponse** (jamais renvoyée au client) et les cartes déjà utilisées.\n- `shop_purchase` : `offerKey` (unique par joueur, ce qui empêche le double achat), `carId`, `price`.\n- `trade_offer` : `offeredCarId`, `wantedCarId` **ou** `price`, `status` (OPEN, COMPLETED, CANCELLED), `buyerId`, `expiresAt`.\n- `auction` : `carId` (en séquestre), `startPrice`, `currentBid` et `bidderId` (meilleure offre, crédits déjà prélevés), `bidCount`, `status` (OPEN, SOLD, UNSOLD, CANCELLED), `endsAt` (repoussé par l'anti « dernière seconde »).\n- `bid` : historique de toutes les offres (`auctionId`, `userId`, `amount`).\n\n### Notifications\n\n`push_subscription` : un appareil par ligne (`endpoint` unique et clés de chiffrement).\n\n## Invariants garantis par le code\n\n| Invariant | Mécanisme |\n| --- | --- |\n| Un booster ne peut pas être ouvert deux fois | Verrou `FOR UPDATE` sur `player` |\n| Le solde ne devient jamais négatif | Objet-valeur `Credits` dans l'agrégat `Wallet`, sous verrou joueur, avec contrôle de concurrence optimiste à l'écriture |\n| Chaque mouvement de crédits est journalisé | `WalletService` (agrégat `Wallet`) est le seul point d'écriture de `credits` ; vérifié par les tests de bout en bout (solde = départ + journal) |\n| Une carte en bourse n'existe qu'une fois | Séquestre : retirée de `user_card` à la publication |\n| Une offre n'est acceptée qu'une fois | Verrou `FOR UPDATE` sur `trade_offer` + vérification du statut |\n| Les crédits d'une enchère ne sont jamais dépensés deux fois | Prélevés à l'offre, rendus au surenchéri dans la même transaction (verrou sur `auction` et sur les deux joueurs) |\n| Un succès ne paie qu'une fois | `INSERT … ON CONFLICT DO NOTHING RETURNING` : la récompense n'est versée que si la ligne a été insérée |\n| La récompense du jour n'est réclamée qu'une fois | Verrou joueur + comparaison de `lastDailyClaim` avec la date du jour |\n| Une offre de boutique n'est achetée qu'une fois par joueur | Contrainte d'unicité `(userId, offerKey)` |\n| Une manche de mini-jeu n'est jouée qu'une fois | Verrou `FOR UPDATE` sur `game_session` |\n| Pas d'interblocage entre deux joueurs | Verrous toujours pris dans l'ordre des identifiants (`PlayerLocks`) ; offre ou enchère verrouillée avant les joueurs |\n"},{"id":"technique/03-authentification-securite","path":"technique/03-authentification-securite.md","section":"Technique","title":"3. Authentification et sécurité","markdown":"# 3. Authentification et sécurité\n\n## Authentification : Better Auth\n\n- **Méthode** : email et mot de passe (8 à 128 caractères), avec connexion automatique après l'inscription.\n- **Mots de passe** : hachés par Better Auth (scrypt), stockés dans `account.password`.\n- **Sessions** : stockées en base (table `session`), valables 30 jours et prolongées une fois par jour d'activité. Le cookie est `httpOnly`, `SameSite=Lax`, et `Secure` automatiquement si `BETTER_AUTH_URL` est en HTTPS. Un cache signé de 5 minutes (`cookieCache`) évite une lecture en base à chaque requête.\n- **Montage** : le gestionnaire Better Auth est monté sur `/api/auth/*` **avant** l'analyse JSON de NestJS, car il lit lui-même le corps brut. Voir `apps/api/src/bootstrap.ts`.\n- **Garde global** : `AuthGuard` (`apps/api/src/modules/identity/http/auth.guard.ts`) protège **toutes** les routes par défaut. Les routes publiques sont marquées explicitement `@Public()` : santé, clé publique push, et les deux routes d'admi
