security:
    password_hashers:
        # Mots de passe hachés par l'algorithme recommandé du moment (bcrypt ou argon2id).
        auth: auto

    providers:
        users:
            entity:
                class: App\Identity\Entity\User
                property: id

    firewalls:
        main:
            pattern: ^/api
            stateless: true
            provider: users
            custom_authenticators:
                - App\Identity\Security\SessionCookieAuthenticator
            entry_point: App\Identity\Security\SessionCookieAuthenticator

    # Tout est protégé par défaut ; seules ces routes sont publiques.
    access_control:
        - { path: ^/api/auth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/push/public-key$, roles: PUBLIC_ACCESS }
        - { path: ^/api/media/, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/, roles: PUBLIC_ACCESS } # protégé par jeton (AdminTokenListener)
        - { path: ^/api, roles: ROLE_PLAYER }

when@test:
    security:
        password_hashers:
            auth:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
