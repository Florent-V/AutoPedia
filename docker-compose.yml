name: garage

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garage}
      POSTGRES_DB: garage
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Accessible uniquement depuis la machine hôte (développement local), jamais depuis le réseau
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage -d garage"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://garage:${POSTGRES_PASSWORD:-garage}@db:5432/garage
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Définissez BETTER_AUTH_SECRET dans .env}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:3000}
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost:3000}
      PORT: 3001
      BOOSTER_REGEN_MINUTES: ${BOOSTER_REGEN_MINUTES:-30}
      BOOSTER_MAX: ${BOOSTER_MAX:-10}
      CARDS_PER_BOOSTER: ${CARDS_PER_BOOSTER:-5}
      CATALOG_AUTO_IMPORT: ${CATALOG_AUTO_IMPORT:-wikidata}
      CATALOG_IMPORT_LIMIT: ${CATALOG_IMPORT_LIMIT:-3000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@example.com}
      WIKI_CONTACT: ${WIKI_CONTACT:-}
      WIKIMEDIA_TOKEN: ${WIKIMEDIA_TOKEN:-}
      MEDIA_DIR: /data/media
      MEDIA_REMOTE_FALLBACK: ${MEDIA_REMOTE_FALLBACK:-true}
      GAME_TIMEZONE: ${GAME_TIMEZONE:-Europe/Paris}
      STARTING_CREDITS: ${STARTING_CREDITS:-100}
      GAMES_PER_DAY: ${GAMES_PER_DAY:-3}
      QUICK_GAMES_PER_DAY: ${QUICK_GAMES_PER_DAY:-5}
      DOORS_PER_DAY: ${DOORS_PER_DAY:-2}
      TRADE_DAYS: ${TRADE_DAYS:-7}
      MAX_OPEN_TRADES: ${MAX_OPEN_TRADES:-10}
      PITY_EPIC: ${PITY_EPIC:-10}
      PITY_LEGENDARY: ${PITY_LEGENDARY:-60}
      SHOP_SECRET: ${SHOP_SECRET:-}
      AUCTION_FEE_PERCENT: ${AUCTION_FEE_PERCENT:-5}
      MAX_OPEN_AUCTIONS: ${MAX_OPEN_AUCTIONS:-5}
      BOTS_ENABLED: ${BOTS_ENABLED:-true}
      BOTS_COUNT: ${BOTS_COUNT:-12}
      BOTS_START_CREDITS: ${BOTS_START_CREDITS:-1500}
      BOTS_TICK_SECONDS: ${BOTS_TICK_SECONDS:-60}
    volumes:
      - media:/data/media

  web:
    build: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_API_BASE: http://api:3001
      NUXT_TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  media:
